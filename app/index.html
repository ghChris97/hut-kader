<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HUT Kader">
<meta name="robots" content="noindex, nofollow">
<title>HUT Kader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: eine Spalte fuers Handy, feste Tab-Leiste unten, Listen als dichte Spielberichts-Zeilen. */
:root{
  color-scheme:dark;
  --ink:#0d1b2a; --panel:#152a40; --panel2:#1b3550; --line:#27425d;
  --ice:#eaf2f8; --mute:#93a8bd; --lamp:#ff5a4f;
  --ovr:#f4c95d; --ap:#b79cff; --sal:#5fd3a2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--ice);font:400 15px/1.4 var(--body);display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
header{padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
h1{font:700 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
h1 b{color:var(--lamp);font-weight:700}
#stand{color:var(--mute);font-size:12px;text-align:right}
main{flex:1;overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
nav a{padding:10px 2px 12px;text-align:center;text-decoration:none;color:var(--mute);font:600 15px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;border-top:3px solid transparent}
nav a[aria-current="page"]{color:var(--ice);border-top-color:var(--lamp)}
nav a span{display:block;font:500 11px/1.3 var(--body);letter-spacing:0;text-transform:none;color:var(--mute)}
h2{font:600 18px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:18px 0 8px;text-wrap:balance}
h2:first-child{margin-top:0}
h3{font:600 15px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:12px 0 6px;color:var(--mute)}
p{margin:0 0 10px}
.mute{color:var(--mute)}
.small{font-size:13px}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
input[type=search],input[type=number],input[type=text],select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 14px/1 var(--display);letter-spacing:.05em}
.chip[aria-pressed="true"]{background:var(--ice);color:var(--ink);border-color:var(--ice)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list{display:flex;flex-direction:column;gap:6px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.row.own{border-color:var(--sal)}
.rowhead{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:8px}
.art{position:relative;width:54px;aspect-ratio:804/1128;border-radius:5px;overflow:hidden;background:var(--ink);display:flex;align-items:center;justify-content:center}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ovr{font:700 24px/1 var(--display);color:var(--ovr);text-align:center;font-variant-numeric:tabular-nums}
.ovr small{display:block;font:600 11px/1.2 var(--display);color:var(--mute);letter-spacing:.06em}
.open{background:none;border:0;padding:0;text-align:left;min-width:0}
.nm{font:600 17px/1.15 var(--display);letter-spacing:.03em;overflow-wrap:anywhere}
.sub{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.sub b{color:var(--ovr);font:700 16px/1 var(--display)}
.tag{display:inline-block;border-radius:4px;padding:0 5px;font:600 11px/1.5 var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);color:var(--ice);margin-left:4px;vertical-align:1px}
.tag.fix{background:var(--ovr);color:var(--ink)} .tag.ban{background:var(--lamp);color:#fff} .tag.new{background:var(--sal);color:var(--ink)}
.act{min-width:44px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font:700 20px/1 var(--display)}
.act.on{background:var(--sal);border-color:var(--sal);color:var(--ink)}
.act.del{color:var(--lamp)}
.detail{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:10px}
.big{display:block;width:min(200px,60%);aspect-ratio:804/1128;border-radius:8px;margin:0 auto;background:var(--ink)}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.attr{background:var(--ink);border-radius:6px;padding:4px 6px;display:flex;justify-content:space-between;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
.attr span{color:var(--mute);font:600 12px/1.6 var(--display);letter-spacing:.05em}
.attr.hi b{color:var(--ovr)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font:600 13px/1.5 var(--display);letter-spacing:.04em;border:1px solid currentColor;white-space:nowrap}
.pill.o{color:var(--ovr)} .pill.a{color:var(--ap)} .pill.s{color:var(--sal)} .pill.n{color:var(--mute)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--lamp);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:700 17px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;min-height:46px;display:inline-block;text-decoration:none;text-align:center}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ice)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:15px}
.btn[disabled]{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{color:var(--mute);font-size:12px}
.tile.o b{color:var(--ovr)} .tile.a b{color:var(--ap)} .tile.s b{color:var(--sal)} .tile.bad b{color:var(--lamp)}
.line{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.linehead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linehead strong{font:600 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.players{display:grid;gap:6px;grid-template-columns:repeat(3,1fr)}
.players.n5{grid-template-columns:repeat(5,1fr)} .players.n4{grid-template-columns:repeat(4,1fr)}
.pl{background:var(--ink);border-radius:8px;padding:6px 8px;min-width:0}
.pl img{display:block;width:100%;aspect-ratio:804/1128;object-fit:cover;border-radius:6px;margin-bottom:6px;background:var(--panel)}
.pl .p{color:var(--mute);font:600 12px/1.3 var(--display);letter-spacing:.06em}
.pl .n{font:600 15px/1.15 var(--display);overflow-wrap:anywhere}
.pl .v{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.pl .v b{color:var(--ovr);font:700 15px/1 var(--display)}
.players.n5 .pl,.players.n4 .pl{padding:4px}
.players.n5 .n,.players.n4 .n{font-size:13px}
.combo{font-size:13px;color:var(--mute)}
.note{border-left:3px solid var(--ovr);background:var(--panel);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-left-color:var(--lamp)} .note.ok{border-left-color:var(--sal)} .note.ap{border-left-color:var(--ap)}
.note .chip{margin-left:6px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label,.lab{font:600 14px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase}
.field small{color:var(--mute)}
.check{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.check input{width:22px;height:22px;accent-color:var(--lamp);flex:none}
.center{text-align:center;padding:28px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:10px}
details>summary{padding:12px;font:600 16px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
details>div{padding:0 12px 12px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.statgrid label{display:flex;flex-direction:column;gap:2px;font:600 12px/1.2 var(--display);letter-spacing:.05em;color:var(--mute)}
.statgrid input{min-height:36px;padding:6px 8px}
.aprow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.aprow:first-child{border-top:0}
.aprow input{width:22px;height:22px;accent-color:var(--ap)}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 8px;align-items:center;font-variant-numeric:tabular-nums}
.cmp .l{text-align:right} .cmp .m{color:var(--mute);font:600 12px/1.4 var(--display);letter-spacing:.05em;text-align:center}
.cmp .win{color:var(--ovr);font-weight:600}
.cmphead{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;text-align:center}
.cmphead img{width:min(150px,100%);aspect-ratio:804/1128;border-radius:8px;background:var(--panel)}
.imprt{display:grid;grid-template-columns:auto 44px 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.imprt .art{width:44px}
.imprt input{width:22px;height:22px;accent-color:var(--sal)}
progress{width:100%;height:10px;accent-color:var(--lamp)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ice);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
a{color:var(--ice)}
.hide{display:none}
@media (min-width:720px){main{padding:16px max(16px,calc(50% - 360px)) 32px}header{padding-inline:max(16px,calc(50% - 360px))}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>HUT Kader <b id="game"></b></h1>
  <div id="stand">Daten werden geladen</div>
</header>
<main id="view"><div class="center mute">Kartendaten werden geladen …</div></main>
<nav aria-label="Bereiche">
  <a href="#karten" data-tab="karten">Karten<span id="n-karten">&nbsp;</span></a>
  <a href="#kader" data-tab="kader">Kader<span id="n-kader">0 Karten</span></a>
  <a href="#reihen" data-tab="reihen">Reihen<span>Optimierer</span></a>
  <a href="#analyse" data-tab="analyse">Analyse<span>Upgrades</span></a>
  <a href="#setup" data-tab="setup">Setup<span>Cap, Coach</span></a>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-shot" accept="image/*" multiple class="hide" aria-label="Screenshots auswählen">
<input type="file" id="file-cam" accept="image/*" capture="environment" class="hide" aria-label="Foto aufnehmen">

<script src="engine.js"></script>
<script>
(function(){
'use strict';
var D=null, byKey={}, byName={}, teamName={}, typeName={};
var S={cap:'', ap:'', coach:'', strict:true, prio:'bal', seenNewer:0, captain:'auto', useRating:false,
       weights:{skating:1,shooting:1,hands:1,checking:1,defense:1}, lastSeen:'', prevSeen:''};
var VD={}, VER='', V={owned:[],locks:{},bans:{},lineups:[],xfOn:{}};  /* Daten je NHL-Version */
var SHARED=null;   /* geteilter Kader aus einem Link: nur ansehen */
var RES=null;      /* letzte Optimierung, wird bei jeder Aenderung verworfen */
var UI={q:'', pos:'', type:'', min:'', sort:'ovr', limit:40, open:null, stat:{}, xf:'', hgt:'', hand:'', onlyNew:false, onlyMine:false,
        more:false, cmp:[], saved:-1, up:null, upMin:'', imp:null};
var PRIO={bal:{ovr:1,ap:0.5,sal:0.25,label:'Ausgewogen'}, ovr:{ovr:1,ap:0.05,sal:0.02,label:'Stärkste Reihen'},
          ap:{ovr:1,ap:2,sal:0.25,label:'Möglichst viele Ability Points'}, sal:{ovr:1,ap:0.5,sal:1.5,label:'Möglichst viel Cap-Bonus'}};
var SA=['ACC','AGI','BAL','END','SPD','SSA','SSP','WSA','WSP','DEK','OAW','HAE','PAS','PC','CHK','STR','AGR','DUR','FS','DAW','BLK','SCH','FO','DIS'];
var SAL=['Acceleration','Agility','Balance','Endurance','Speed','Slap Shot Accuracy','Slap Shot Power','Wrist Shot Accuracy','Wrist Shot Power','Deking','Off. Awareness','Hand-Eye','Passing','Puck Control','Body Checking','Strength','Aggression','Durability','Fighting Skill','Def. Awareness','Shot Blocking','Stick Checking','Faceoffs','Discipline'];
var GA=['GH','SH','GL','PK','SL','PAS','SPD','VIS','END','AGI','POS','5H','BRK','REC','AGR','RBC','DUR'];
var GRP={skating:'Skating',shooting:'Schuss',hands:'Hände',checking:'Checking',defense:'Defensive'};
var view=document.getElementById('view');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function key(c){return c.k+c.id;}
function money(v){return '$'+(Math.round(v*10)/10).toFixed(1)+'M';}
function tab(){var h=(location.hash||'').replace('#','');return ['karten','kader','reihen','analyse','setup'].indexOf(h)>=0?h:'karten';}
function toast(t){var el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(function(){el.classList.remove('on');},2600);}

function load(){
  try{
    var r=JSON.parse(localStorage.getItem('hutkader')||'null');
    if(r){
      for(var k in S) if(r[k]!==undefined) S[k]=r[k];
      VD=r.v||{};
      if(r.rosters) for(var ver in r.rosters) if(!VD[ver]) VD[ver]={owned:r.rosters[ver]};   // Format der Vorversion
    }else{
      var o=JSON.parse(localStorage.getItem('hut27')||'null');
      if(o){for(var j in S) if(o[j]!==undefined) S[j]=o[j]; if(o.owned&&o.owned.length) VD['27']={owned:o.owned};}
    }
  }catch(e){}
}
function save(){
  RES=null;
  if(VER) VD[VER]=V;
  var out={v:VD}; for(var k in S) out[k]=S[k];
  try{localStorage.setItem('hutkader',JSON.stringify(out));}catch(e){}
  count();
}
function count(){var n=(SHARED||V.owned).length; document.getElementById('n-kader').textContent=n+(n===1?' Karte':' Karten');}
function owned(){return (SHARED||V.owned).map(function(k){return byKey[k];}).filter(Boolean);}
function isOwned(c){return (SHARED||V.owned).indexOf(key(c))>=0;}
function valFn(){return S.useRating?HUT.rating(S.weights):function(p){return p.ovr;};}
function opts(){return {coach:S.coach,strict:S.strict,cap:parseFloat(S.cap)||0,w:PRIO[S.prio]||PRIO.bal,val:valFn(),locks:SHARED?{}:V.locks,bans:SHARED?{}:V.bans,captain:S.captain};}
function result(){ if(!RES) RES=HUT.optimize(D,owned(),opts()); return RES; }
function newSince(){
  if(S.prevSeen) return S.prevSeen;
  var d=new Date(D.meta.updated); d.setDate(d.getDate()-7); return d.toISOString().slice(0,10);
}
function inches(h){var m=/(\d+)'\s*(\d+)/.exec(h||''); return m?(+m[1])*12+(+m[2]):0;}

function sub(c){
  var v=S.useRating&&c.k==='s'?' · Wert '+valFn()(c).toFixed(1):'';
  return '<b>'+c.ovr+'</b> · '+[c.pos, c.hand==='L'?'links':'rechts', c.ctn, c.tmn, money(c.sal||0)].map(esc).join(' · ')+v;
}
/* Kartenbild direkt von der Quelle, erst beim Scrollen geladen. Laedt es nicht, bleibt die OVR-Zahl stehen. */
function img(c,cls){
  if(!c.art||!D.meta.img_base) return '';
  return '<img'+(cls?' class="'+cls+'"':'')+' src="'+esc(D.meta.img_base+c.art)+'" alt="Karte '+esc(c.n)+' '+c.ovr+'" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">';
}
function tags(c){
  var k=key(c), t='';
  if(!SHARED&&V.locks[k]) t+='<span class="tag fix">fix</span>';
  if(!SHARED&&V.bans[k]) t+='<span class="tag ban">gesperrt</span>';
  if(c.add>newSince()) t+='<span class="tag new">neu</span>';
  return t;
}
function rowHtml(c, mode){
  var k=key(c), own=isOwned(c), open=UI.open===k;
  var btn = mode==='kader'
    ? '<button class="act del" data-rm="'+k+'" aria-label="'+esc(c.n)+' aus dem Kader entfernen">×</button>'
    : '<button class="act'+(own?' on':'')+'" data-tg="'+k+'" aria-pressed="'+own+'" aria-label="'+esc(c.n)+(own?' aus dem Kader entfernen':' zum Kader hinzufügen')+'">'+(own?'✓':'+')+'</button>';
  return '<div class="row'+(own&&mode!=='kader'?' own':'')+'">'+
    '<div class="rowhead"><div class="art"><div class="ovr">'+c.ovr+'<small>'+esc(c.pos)+'</small></div>'+img(c)+'</div>'+
    '<button class="open" data-open="'+k+'" aria-expanded="'+open+'"><div class="nm">'+esc(c.n)+tags(c)+'</div><div class="sub">'+sub(c)+'</div></button>'+btn+'</div>'+
    (open?detailHtml(c):'')+'</div>';
}
function xfPill(id){
  var x=D.xf&&D.xf[id]; if(!x) return '<span class="pill a">X-Factor '+id+'</span>';
  return '<span class="pill a" title="'+esc(x.d)+'">'+esc(x.n)+' · '+esc(x.t)+' · '+x.ap+' AP</span>';
}
function detailHtml(c){
  var labels=c.k==='g'?GA:SA, k=key(c), h='<div class="detail">'+img(c,'big');
  h+='<div class="small mute">'+esc(typeName[c.ctn]||c.ctn)+' · '+esc(teamName[c.tm]||c.tmn)+' · '+esc(c.lgn)+' · '+esc(c.nat)+' · '+esc(c.hgt)+', '+(c.wgt||'?')+' lb'+(c.aovr?' · aOVR '+c.aovr.toFixed(2):'')+(c.add?' · seit '+esc(c.add.split('-').reverse().join('.')):'')+'</div>';
  if(c.xf&&c.xf.length) h+='<div class="pills">'+c.xf.map(xfPill).join('')+'</div>';
  h+='<div class="attrs">'+c.a.map(function(v,i){return '<div class="attr'+(v>=95?' hi':'')+'"><span>'+labels[i]+'</span><b>'+v+'</b></div>';}).join('')+'</div>';
  var b='<button class="btn ghost sm" data-cmp="'+k+'">Vergleichen</button>';
  if(!SHARED&&isOwned(c)){
    b+='<button class="btn ghost sm" data-lock="'+k+'" aria-pressed="'+!!V.locks[k]+'">'+(V.locks[k]?'Fixierung lösen':'Fixieren')+'</button>'+
       '<button class="btn ghost sm" data-ban="'+k+'" aria-pressed="'+!!V.bans[k]+'">'+(V.bans[k]?'Sperre lösen':'Sperren')+'</button>';
  }
  h+='<div class="btns">'+b+'</div>';
  var others=(byName[c.n]||[]).filter(function(o){return o!==c;});
  if(others.length){
    h+='<div class="small"><span class="mute">Weitere Karten: </span>'+others.slice(0,10).map(function(o){
      return '<button class="chip" data-open="'+key(o)+'" data-jump="1">'+o.ovr+' '+esc(o.ctn)+' '+esc(o.tmn)+'</button>';}).join(' ')+'</div>';
  }
  return h+'</div>';
}

/* ---------- Karten ---------- */
function filtered(){
  var q=UI.q.trim().toUpperCase(), min=+UI.min||0, ns=newSince(), stats=Object.keys(UI.stat), hmin=+UI.hgt||0;
  var sortAttr=/^a\d+$/.test(UI.sort)?+UI.sort.slice(1):-1;
  var out=D.cards.filter(function(c){
    if(q && c.n.indexOf(q)<0) return false;
    if(UI.pos){
      if(UI.pos==='F'){ if(['LW','C','RW'].indexOf(c.pos)<0) return false; }
      else if(UI.pos==='D'){ if(['LD','RD'].indexOf(c.pos)<0) return false; }
      else if(c.pos!==UI.pos) return false;
    }
    if(UI.type && c.ctn!==UI.type) return false;
    if(min && c.ovr<min) return false;
    if(UI.onlyNew && !(c.add>ns)) return false;
    if(UI.onlyMine && !isOwned(c)) return false;
    if(UI.hand && c.hand!==UI.hand) return false;
    if(hmin && inches(c.hgt)<hmin) return false;
    if(UI.xf && !c.xf.some(function(x){return D.xf[x]&&D.xf[x].n===UI.xf;})) return false;
    if(stats.length||sortAttr>=0){
      if(c.k!=='s') return false;
      for(var i=0;i<stats.length;i++) if(c.a[+stats[i]]<UI.stat[stats[i]]) return false;
    }
    return true;
  });
  if(sortAttr>=0) out.sort(function(a,b){return b.a[sortAttr]-a.a[sortAttr]||b.ovr-a.ovr;});
  else if(UI.sort==='new') out.sort(function(a,b){return a.add<b.add?1:a.add>b.add?-1:b.ovr-a.ovr;});
  else if(UI.sort==='sal') out.sort(function(a,b){return (a.sal||0)-(b.sal||0)||b.ovr-a.ovr;});
  else if(UI.sort==='aovr') out.sort(function(a,b){return (b.aovr||0)-(a.aovr||0);});
  else if(UI.sort==='val'){var v=valFn(); out.sort(function(a,b){return v(b)-v(a);});}
  return out;
}

function grpAvg(c,g){var idx=HUT.GROUPS[g], s=0; idx.forEach(function(i){s+=c.a[i];}); return s/idx.length;}

  var a=byKey[UI.cmp[0]], b=byKey[UI.cmp[1]];
  if(!a&&!b) return '<p class="small mute">Öffne eine Karte unter Karten oder Kader und tippe auf „Vergleichen". Zwei Karten stehen dann hier nebeneinander.</p>';

  var h='<div class="cmphead">'+head(a,0)+head(b,1)+'</div>';

  if(a.k!==b.k) return h+'<p class="note warn">Feldspieler und Goalies haben unterschiedliche Werte und lassen sich nicht vergleichen.</p>';
  var row=function(l,x,y,dec){var f=function(v){return dec?v.toFixed(1):v;}; return '<div class="l'+(x>y?' win':'')+'">'+f(x)+'</div><div class="m">'+l+'</div><div class="'+(y>x?'win':'')+'">'+f(y)+'</div>';};
  h+='<div class="cmp">'+row('OVR',a.ovr,b.ovr)+row('aOVR',a.aovr||0,b.aovr||0,true)+'<div class="l">'+money(a.sal||0)+'</div><div class="m">GEHALT</div><div>'+money(b.sal||0)+'</div>';
  if(a.k==='s'){
    Object.keys(GRP).forEach(function(g){h+=row(GRP[g].toUpperCase(),grpAvg(a,g),grpAvg(b,g),true);});
    h+='</div><h3>Alle Werte</h3><div class="cmp">'+SA.map(function(l,i){return row(l,a.a[i],b.a[i]);}).join('');
  }else{
    h+='</div><h3>Alle Werte</h3><div class="cmp">'+GA.map(function(l,i){return row(l,a.a[i],b.a[i]);}).join('');
  }
  h+='</div>';
  var xa=a.xf.map(xfPill).join(''), xb=b.xf.map(xfPill).join('');

/* ---------- Kader teilen ---------- */
function encodeRoster(keys){return keys.map(function(k){return k[0]+(+k.slice(1)).toString(36);}).join('.');}
function decodeRoster(s){return String(s||'').split('.').map(function(t){var n=parseInt(t.slice(1),36); return /^[sg]/.test(t)&&n>0?t[0]+n:null;}).filter(Boolean);}
function shareRoster(){
  var url=location.origin+location.pathname+'?k='+encodeRoster(V.owned);
  var done=function(){toast('Link kopiert');};
  var manual=function(){var el=document.getElementById('clear-ask'); if(el) el.innerHTML='<input type="text" readonly value="'+esc(url)+'" aria-label="Link zum Kader" onfocus="this.select()">';};
  if(navigator.share){navigator.share({title:'Mein HUT-Kader',url:url}).catch(function(){});}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,manual);}
  else manual();
}

/* ---------- Kader aus Screenshot oder Foto ---------- */
var NAMES=null, SUR={};
function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();}
function buildNames(){
  if(NAMES) return;
  NAMES=[];
  Object.keys(byName).forEach(function(n){
    var t=norm(n).split(' '); if(!t.length) return;
    var e={n:n,toks:t,last:t[t.length-1],first:t[0],max:Math.max.apply(null,byName[n].map(function(c){return c.ovr;}))};
    NAMES.push(e); (SUR[e.last]=SUR[e.last]||[]).push(e);
  });
}
function near1(a,b){ // hoechstens ein Zeichen Unterschied
  if(a===b) return true;
  var la=a.length, lb=b.length; if(Math.abs(la-lb)>1) return false;
  var i=0,j=0,d=0;
  while(i<la&&j<lb){ if(a[i]===b[j]){i++;j++;continue;} if(++d>1) return false; if(la>lb) i++; else if(lb>la) j++; else {i++;j++;} }
  return d+(la-i)+(lb-j)<=1;
}
var STOP={HOCKEY:1,ULTIMATE:1,TEAM:1,TEAMS:1,LINEUP:1,LINE:1,LINES:1,SALARY:1,OVERALL:1,COACH:1,CAPTAIN:1,FORWARD:1,FORWARDS:1,DEFENSE:1,GOALIE:1,GOALIES:1,
  ABILITY:1,POINTS:1,CHEMISTRY:1,COMBO:1,COMBOS:1,BOOST:1,ACTIVE:1,PLAYER:1,PLAYERS:1,ROSTER:1,EDIT:1,BACK:1,SELECT:1,OPTIONS:1,POWER:1,PLAY:1,PENALTY:1,KILL:1,
  EXTRA:1,ATTACKER:1,SHOOTOUT:1,STARTER:1,BACKUP:1,CENTER:1,WING:1,LEFT:1,RIGHT:1,ITEM:1,ITEMS:1,COLLECTION:1,MARKET:1,AUCTION:1,HOUSE:1,PACKS:1,STORE:1,HOME:1};
function matchText(text){
  buildNames();
  var lines=text.split(/\n/).map(norm), surs=Object.keys(SUR), found=[], seen={};
  var numsOf=function(l){return ((l||'').match(/\b[6-9]\d\b/g)||[]).map(Number);};
  lines.forEach(function(line,li){
    if(!line) return;
    var toks=line.split(' '), hits=[];
    toks.forEach(function(t,ti){
      if(t.length<4||/\d/.test(t)||STOP[t]) return;
      var group=SUR[t], fuzzy=false;
      if(!group&&t.length>=6){ for(var i=0;i<surs.length;i++){ if(near1(t,surs[i])){group=SUR[surs[i]]; fuzzy=true; break;} } }
      if(group) hits.push({t:t,ti:ti,group:group,fuzzy:fuzzy});
    });
    if(!hits.length) return;
    var prev=numsOf(lines[li-1]), next=numsOf(lines[li+1]), any=prev.concat(numsOf(line),next);
    hits.forEach(function(h,hi){
      // Die OVR-Zahl, die am ehesten zu diesem Namen gehoert: gleiche Zeile (naechste Zahl), sonst gleiche Spalte in der Zeile darueber oder darunter
      var main=null, best=99;
      toks.forEach(function(x,xi){ if(/^[6-9]\d$/.test(x)&&Math.abs(xi-h.ti)<best){best=Math.abs(xi-h.ti); main=+x;} });
      if(main===null&&prev.length===hits.length) main=prev[hi];
      if(main===null&&next.length===hits.length) main=next[hi];
      var group=h.group;
      var strong=group.filter(function(e){return e.toks.length>1&&toks.indexOf(e.first)>=0;});
      var initial=group.filter(function(e){return toks.some(function(x){return x.length===1&&x===e.first[0];});});
      var pick=strong.length?strong:(initial.length?initial:group);
      pick=pick.slice().sort(function(a,b){return b.max-a.max;});
      if(seen[pick[0].n]) return; seen[pick[0].n]=1;
      var cards=[]; pick.slice(0,4).forEach(function(e){byName[e.n].forEach(function(c){cards.push(c);});});
      var rank=function(c){return c.ovr===main?2:(any.indexOf(c.ovr)>=0?1:0);};
      cards.sort(function(a,b){return rank(b)-rank(a)||b.ovr-a.ovr;});
      var hit=rank(cards[0])>0;
      found.push({cards:cards.slice(0,24),sel:key(cards[0]),on:(strong.length>0||hit||(!h.fuzzy&&h.t.length>=5))&&!isOwned(cards[0]),sure:hit,token:h.t});
    });
  });
  return found;
}
var SCAN_URL='https://vbdgynxlcwuavhzakysy.supabase.co/functions/v1/hut-scan';
function prepImage(file){ // verkleinern und als JPEG kodieren, damit der Upload klein bleibt
  return new Promise(function(ok,no){
    var url=URL.createObjectURL(file), im=new Image();
    im.onload=function(){
      var sc=Math.min(1, 1800/Math.max(im.width,im.height));
      var c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg',0.85).split(',')[1]);
    };
    im.onerror=function(){URL.revokeObjectURL(url); no(new Error('Das Bild konnte nicht gelesen werden.'));};
    im.src=url;
  });
}
var SCAN_CTRL=null;
function scanImage(b64){
  SCAN_CTRL=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){ if(SCAN_CTRL) SCAN_CTRL.abort(); },150000);
  return fetch(SCAN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64,mime:'image/jpeg'}),signal:SCAN_CTRL?SCAN_CTRL.signal:undefined})
    .finally(function(){clearTimeout(to);})
    .then(function(r){return r.json().catch(function(){return {error:'HTTP '+r.status};}).then(function(j){ if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status)); return j.cards||[]; });},
          function(e){ if(e&&e.name==='AbortError') throw new Error(UI.imp&&UI.imp.cancel?'Abgebrochen.':'Gemini hat zu lange gebraucht. Versuch es gleich noch einmal.'); throw new Error('Keine Verbindung zum Scan-Dienst. Für das Einlesen brauchst du Internet.');});
}
var POSMAP={LA:'LW',RA:'RW',LV:'LD',RV:'RD',LF:'LW',RF:'RW',D:'',F:'',TW:'G',GK:'G'};
/* Karten zu einem gelesenen Namen finden: voller Name, sonst Nachname (mit Vornamen-Initiale), sonst ein Tippfehler Abstand */
function cardsForName(name){
  buildNames();
  var t=norm(name).split(' ').filter(Boolean); if(!t.length) return [];
  var full=t.join(' '), hit=NAMES.filter(function(e){return e.toks.join(' ')===full;});
  if(!hit.length){
    var last=t[t.length-1], group=SUR[last];
    if(!group&&last.length>=5){var surs=Object.keys(SUR); for(var i=0;i<surs.length;i++) if(near1(last,surs[i])){group=SUR[surs[i]]; break;}}
    if(!group&&t.length>1){ // Nachname zuerst gelesen, z. B. "BERTUZZI TYLER"
      group=SUR[t[0]]; if(group) t=t.slice(1).concat([t[0]]);
    }
    if(group){
      var first=t.length>1?t[0]:'';
      var exactFirst=group.filter(function(e){return first&&e.first===first;});
      var nearFirst=group.filter(function(e){return first&&(e.first[0]===first[0]);});
      hit=exactFirst.length?exactFirst:(nearFirst.length?nearFirst:group);
    }
  }
  var cards=[]; hit.forEach(function(e){byName[e.n].forEach(function(c){cards.push(c);});});
  return cards;
}
function matchScan(list){
  var found=[], seen={};
  list.forEach(function(it){
    var cards=cardsForName(it.name||''); if(!cards.length){found.push({cards:[],token:it.name,ovr:it.ovr,on:false}); return;}
    var shown=+it.ovr||0, pos=String(it.pos||'').toUpperCase(); pos=POSMAP[pos]!==undefined?POSMAP[pos]:pos;
    // Im Spiel steht die OVR inklusive Reihen-Bonus, deshalb auch 1 bis 2 Punkte darunter zulassen
    var score=function(c){var d=shown-c.ovr; var s=d===0?10:d===1?8:d===2?6:d===-1?3:0; if(pos&&c.pos===pos) s+=2; if(pos==='G'&&c.k==='g') s+=2; return s;};
    cards.sort(function(a,b){return score(b)-score(a)||b.ovr-a.ovr;});
    var best=cards[0], k=key(best); if(seen[k]) return; seen[k]=1;
    found.push({cards:cards.slice(0,24),sel:k,on:!isOwned(best),sure:score(best)>=8,token:it.name,ovr:shown,line:it.line||''});
  });
  return found;
}
function runImport(files){
  files=Array.prototype.slice.call(files||[]); if(!files.length) return;
  UI.imp={step:'scan',msg:'Bild wird vorbereitet …'}; if(tab()!=='kader') location.hash='#kader'; else viewKader();
  var all=[], chain=Promise.resolve();
  files.forEach(function(f,i){
    chain=chain.then(function(){UI.imp.msg='Gemini liest Bild '+(i+1)+' von '+files.length+' …'; viewKader(); return prepImage(f);})
      .then(scanImage).then(function(cs){all=all.concat(cs);});
  });
  chain.then(function(){
    UI.imp={step:'review',found:matchScan(all),raw:all}; viewKader();
  }).catch(function(e){
    UI.imp={step:'error',msg:(e&&e.message)||'Das Einlesen ist fehlgeschlagen.'}; viewKader();
  });
}
function runPaste(text){
  UI.imp={step:'review',found:matchText(text||''),text:text||''}; viewKader();
}

  var n=ok.filter(function(f){return f.on;}).length;

      f.cards.map(function(o){return opt(key(o),o.n+' · '+o.ovr+' '+o.pos+' '+o.ctn+' '+o.tmn+(isOwned(o)?' (im Kader)':''),f.sel);}).join('')+'</select>'+
      '<div class="small '+(f.sure?'mute':'')+'" style="'+(f.sure?'':'color:var(--ovr)')+'">gelesen: '+esc(f.token)+(f.ovr?' · '+f.ovr:'')+(f.line?' · '+esc(f.line):'')+(f.sure?'':' · bitte prüfen')+'</div></div></div>';
  });
  h+='</div>';
  if(bad.length) h+='<p class="note warn" style="margin-top:10px">Nicht in den Kartendaten gefunden: '+bad.map(function(f){return esc(f.token)+(f.ovr?' ('+f.ovr+')':'');}).join(', ')+'. Such sie unter Karten von Hand.</p>';
  h+='<div class="btns" style="margin-top:14px"><button class="btn" id="imp-ok">'+n+(n===1?' Karte':' Karten')+' übernehmen</button><button class="btn ghost" id="imp-x">Abbrechen</button></div>';
  if(I.raw) h+='<details><summary>Von Gemini gelesen ('+I.raw.length+')</summary><div><p class="small mute">'+I.raw.map(function(r){return esc(r.name)+' '+esc(r.ovr)+(r.pos?' '+esc(r.pos):'');}).join('<br>')+'</p></div></details>';
  view.innerHTML=h;
}

/* ---------- Steuerung ---------- */
function render(){
  var t=tab();
  Array.prototype.forEach.call(document.querySelectorAll('nav a'),function(a){ if(a.dataset.tab===t) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  count();
  if(!D) return;
  ({karten:viewKarten,kader:viewKader,reihen:viewReihen,analyse:viewAnalyse,setup:viewSetup})[t]();
}
function toggle(k){
  if(SHARED){toast('Geteilter Kader: nur ansehen'); return false;}
  var i=V.owned.indexOf(k);
  if(i>=0){V.owned.splice(i,1); delete V.locks[k]; delete V.bans[k];} else V.owned.push(k);
  UI.up=null; save(); return true;
}
function lineupInfo(r){return 'Ø '+r.totals.avg.toFixed(1)+' · +'+r.totals.ap+' AP · '+money(r.totals.sal);}

view.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  var d=b.dataset;
  if(d.tg){ if(toggle(d.tg)){ if(tab()==='karten') results(); else render(); } return; }
  if(d.rm){toggle(d.rm); render(); return;}
  if(d.cmp){
    if(UI.cmp.indexOf(d.cmp)<0){ if(UI.cmp.length>=2) UI.cmp.shift(); UI.cmp.push(d.cmp); }
    if(UI.cmp.length===2){location.hash='#analyse';} else toast('Erste Karte gemerkt. Jetzt die zweite wählen.');
    return;
  }
  if(d.cmpx!==undefined){UI.cmp.splice(+d.cmpx,1); viewAnalyse(); return;}
  if(d.lock){ if(V.locks[d.lock]) delete V.locks[d.lock]; else {V.locks[d.lock]=1; delete V.bans[d.lock];} save(); render(); return; }
  if(d.ban){ if(V.bans[d.ban]) delete V.bans[d.ban]; else {V.bans[d.ban]=1; delete V.locks[d.ban];} save(); render(); return; }
  if(d.open){
    if(d.jump){var c=byKey[d.open]; UI.q=c.n; UI.pos='';UI.type='';UI.min='';UI.stat={};UI.xf='';UI.hgt='';UI.hand='';UI.onlyNew=false;UI.onlyMine=false;UI.sort='ovr';UI.open=d.open; if(tab()==='karten') viewKarten(); else location.hash='#karten'; return;}
    UI.open=UI.open===d.open?null:d.open; if(tab()==='karten') results(); else render(); return;}
  if(d.pos!==undefined){UI.pos=d.pos; UI.limit=40; viewKarten(); return;}
  if(d.sv!==undefined){UI.saved=+d.sv; viewReihen(); view.scrollTop=0; return;}
  if(d.svdel!==undefined){V.lineups.splice(+d.svdel,1); UI.saved=-1; save(); viewReihen(); return;}
  switch(b.id){
    case 'f-new': UI.onlyNew=!UI.onlyNew; UI.limit=40; viewKarten(); break;
    case 'f-mine': UI.onlyMine=!UI.onlyMine; UI.limit=40; viewKarten(); break;
    case 'f-more': UI.more=!UI.more; viewKarten(); break;
    case 'f-clear': UI.stat={};UI.xf='';UI.hgt='';UI.hand=''; viewKarten(); break;
    case 'newer-ok': S.seenNewer=D.meta.newer.version; save(); viewKarten(); break;
    case 'more': UI.limit+=60; results(); break;
    case 'install': if(installEvt){var ev=installEvt; installEvt=null; try{ev.prompt(); ev.userChoice.then(function(){ if(tab()==='setup') viewSetup(); });}catch(err){} } break;
    case 'clear': document.getElementById('clear-ask').innerHTML='<button class="btn" id="clear-yes">Wirklich alle '+V.owned.length+' entfernen</button>'; break;
    case 'clear-yes': V.owned=[];V.locks={};V.bans={};V.xfOn={}; UI.up=null; save(); render(); break;
    case 'share': shareRoster(); break;
    case 'sh-take': V.owned=SHARED.slice();V.locks={};V.bans={}; SHARED=null; history.replaceState(null,'',location.pathname+location.hash); UI.up=null; save(); render(); toast('Kader übernommen'); break;
    case 'sh-close': SHARED=null; history.replaceState(null,'',location.pathname+location.hash); RES=null; UI.up=null; render(); break;
    case 'imp-shot': document.getElementById('file-shot').click(); break;
    case 'imp-cam': document.getElementById('file-cam').click(); break;
    case 'imp-x': UI.imp=null; viewKader(); break;
    case 'imp-paste': UI.imp={step:'paste'}; viewKader(); break;
    case 'imp-cancel': if(UI.imp) UI.imp.cancel=true; if(SCAN_CTRL) SCAN_CTRL.abort(); break;
    case 'imp-paste-go': runPaste(document.getElementById('imp-text').value); break;
    case 'imp-ok':
      var n=0; UI.imp.found.forEach(function(f){ if(f.on&&V.owned.indexOf(f.sel)<0){V.owned.push(f.sel); n++;} });
      UI.imp=null; UI.up=null; save(); viewKader(); toast(n+(n===1?' Karte':' Karten')+' übernommen'); break;
    case 'ap-auto': apAuto(result()); UI.dAp=true; save(); viewReihen(); break;
    case 'ap-none': V.xfOn={}; UI.dAp=true; save(); viewReihen(); break;
    case 'sv-save':
      var r=result(), nm=(document.getElementById('sv-name').value||'').trim()||('Aufstellung '+(V.lineups.length+1));
      V.lineups.push({name:nm,info:lineupInfo(r),f:r.forwards.map(function(l){return l.players.map(key);}),d:r.defense.map(function(l){return l.players.map(key);}),g:r.goalies.map(key),c:r.totals.captain&&r.totals.captain.active?r.totals.captain.cap.k+r.totals.captain.cap.id:''});
      if(V.lineups.length>12) V.lineups.shift();
      save(); viewReihen(); toast('Aufstellung gemerkt'); break;
    case 'sv-back': UI.saved=-1; viewReihen(); break;
    case 'up-run': UI.up='run'; viewAnalyse(); setTimeout(function(){var o=opts(); o.minOvr=+UI.upMin||0; UI.up=HUT.upgrades(D,result(),o,25); if(tab()==='analyse') viewAnalyse();},30); break;
  }
});
view.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){UI.q=t.value; UI.limit=40; results();}
  else if(t.dataset.stat!==undefined){var v=parseInt(t.value,10); if(v>0) UI.stat[t.dataset.stat]=v; else delete UI.stat[t.dataset.stat]; UI.limit=40; results();}
  else if(t.id==='s-cap'){S.cap=t.value; UI.up=null; save();}
  else if(t.id==='s-ap'){S.ap=t.value; save();}
});
view.addEventListener('change',function(e){
  var t=e.target, d=t.dataset;
  if(t.id==='f-type'){UI.type=t.value; UI.limit=40; results();}
  else if(t.id==='f-min'){UI.min=t.value; UI.limit=40; results();}
  else if(t.id==='f-sort'){UI.sort=t.value; UI.limit=40; results();}
  else if(t.id==='f-xf'){UI.xf=t.value; UI.limit=40; results();}
  else if(t.id==='f-hgt'){UI.hgt=t.value; UI.limit=40; results();}
  else if(t.id==='f-hand'){UI.hand=t.value; UI.limit=40; results();}
  else if(t.id==='up-min'){UI.upMin=t.value; UI.up=null;}
  else if(t.id==='s-coach'){S.coach=t.value; UI.up=null; save();}
  else if(t.id==='s-captain'){S.captain=t.value; save();}
  else if(t.id==='s-prio'){S.prio=t.value; UI.up=null; save();}
  else if(t.id==='s-strict'){S.strict=t.checked; UI.up=null; save();}
  else if(t.id==='s-rate'){S.useRating=t.checked; UI.up=null; save(); viewSetup();}
  else if(d.w){S.weights[d.w]=+t.value; UI.up=null; save();}
  else if(d.xf){ if(t.checked) V.xfOn[d.xf]=1; else delete V.xfOn[d.xf]; UI.dAp=true; var keep=RES; save(); RES=keep; viewReihen(); }
  else if(d.impon!==undefined){UI.imp.found[+d.impon].on=t.checked; viewImport();}
  else if(d.impsel!==undefined){UI.imp.found[+d.impsel].sel=t.value; UI.imp.found[+d.impsel].on=!isOwned(byKey[t.value]); UI.imp.found[+d.impsel].sure=true; viewImport();}
});
view.addEventListener('toggle',function(e){
  var t=e.target; if(!t.id) return;
  if(t.id==='d-ap') UI.dAp=t.open; else if(t.id==='d-st') UI.dSt=t.open;
  else if(t.id==='d-nm'){UI.dNm=t.open; var el=document.getElementById('nm-body'); if(t.open&&el&&!el.innerHTML) el.innerHTML=nmHtml(result());}
},true);
document.getElementById('file-shot').addEventListener('change',function(){runImport(this.files); this.value='';});
document.getElementById('file-cam').addEventListener('change',function(){runImport(this.files); this.value='';});
window.addEventListener('hashchange',function(){UI.open=null; UI.saved=-1; if(tab()!=='kader'&&UI.imp&&UI.imp.step!=='scan') UI.imp=null; render(); view.scrollTop=0;});

load(); render();
fetch('hut.json').then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(function(d){
  D=d; D.xf=D.xf||{}; D.captains=D.captains||[];
  VER=String(d.meta.version||((d.meta.img_base||'').match(/NHL(\d+)/)||[])[1]||'');
  var v=VD[VER]||{};
  V={owned:(v.owned||[]).slice(),locks:v.locks||{},bans:v.bans||{},lineups:v.lineups||[],xfOn:v.xfOn||{}};
  d.cards.forEach(function(c){byKey[key(c)]=c; (byName[c.n]=byName[c.n]||[]).push(c);});
  d.lists.team.forEach(function(t){teamName[t.id]=t.name;});
  d.lists.card_type.forEach(function(t){typeName[t.abbr]=t.name;});
  document.getElementById('game').textContent=d.meta.game||(VER?'NHL '+VER:'');
  if(S.coach && !d.coaches.some(function(c){return c.name===S.coach;})) S.coach='';
  var today=String(d.meta.updated).slice(0,10);
  if(S.lastSeen!==today){S.prevSeen=S.lastSeen||''; S.lastSeen=today; save();}
  var k=new URLSearchParams(location.search).get('k');
  if(k){var keys=decodeRoster(k).filter(function(x){return byKey[x];}); if(keys.length) SHARED=keys;}
  document.getElementById('stand').textContent='Stand '+new Date(d.meta.updated).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  document.getElementById('n-karten').textContent=d.cards.length.toLocaleString('de-DE');
  if(SHARED&&tab()==='karten') location.hash='#reihen'; else render();
}).catch(function(err){
  view.innerHTML='<div class="center"><h2>Kartendaten konnten nicht geladen werden</h2><p class="mute">'+esc(err.message)+'. Lade die Seite neu.</p></div>';
});
})();
</script>
