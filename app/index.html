<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#29323e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HUT Kader">
<meta name="robots" content="noindex, nofollow">
<title>HUT Kader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: eine Spalte fuers Handy, feste Tab-Leiste unten, Listen als dichte Spielberichts-Zeilen. */
:root{
  /* Layout: eine Spalte fuers Handy, Kopfzeile oben, Tab-Leiste mit Symbolen unten, Karten-Detail als eigene Seite darueber. */
  color-scheme:dark;
  --bg:#0a1220; --surface:#111c2d; --surface2:#17253a; --raise:#1d2e47; --line:#22324b; --line2:#2d4160;
  --ice:#edf3fa; --mute:#8fa3bb; --faint:#5f7590;
  --accent:#ff4f45; --accent2:#ff776e; --blue:#5bb8ff;
  --ovr:#f5c84c; --ap:#b39dff; --sal:#4fd6a0;
  --gold1:#ffe08a; --gold2:#c99a2e; --silv1:#e3edf7; --silv2:#8ea2b8; --brz1:#e2b48d; --brz2:#9a6a45;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% -10%,#14233a 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ice);font:400 15px/1.45 var(--body);display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
img{max-width:100%}

/* Kopfzeile */
header{padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(10,18,32,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,var(--accent),#c4302a);display:grid;place-items:center;font:700 13px/1 var(--display);letter-spacing:.04em;color:#fff;box-shadow:0 4px 12px -4px rgba(255,79,69,.6)}
h1{font:600 19px/1 var(--body);letter-spacing:-.01em;margin:0}
h1 small{display:block;font:600 11px/1.3 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);margin-top:3px}
#stand{color:var(--faint);font-size:12px;text-align:right}

main{flex:1;overflow-y:auto;padding:14px 16px 28px;-webkit-overflow-scrolling:touch}

/* Tab-Leiste */
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:rgba(13,22,37,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;text-decoration:none;color:var(--faint);font:600 11.5px/1.1 var(--body);border-radius:10px;position:relative}
nav a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a[aria-current="page"]{color:var(--ice)}
nav a[aria-current="page"] svg{stroke:var(--accent)}
nav .badge{position:absolute;top:1px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font:700 11px/18px var(--body);text-align:center}
nav .badge:empty{display:none}

/* Typografie */
h2{font:600 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
h2 .count{color:var(--faint);font-weight:500;letter-spacing:.04em}
h2:first-child{margin-top:4px}
h3{font:600 12px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 8px;color:var(--faint)}
p{margin:0 0 10px}
.mute{color:var(--mute)} .small{font-size:13px}
.lead{font-size:13px;color:var(--mute);margin:2px 0 12px}
.fchips{gap:6px}
.fchips .chip{padding:6px 12px;font-size:13px}
.fsep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.fsel{display:grid;grid-template-columns:1fr auto;gap:6px}
.fsel3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pickb{display:flex;align-items:center;gap:6px;min-width:0;padding:0 8px;height:40px;background:var(--surface);border:1px solid var(--line);color:var(--ice);border-radius:3px;font:500 13.5px/1 var(--body);cursor:pointer}
.pickb span{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickb .ph{color:var(--mute)}
.pickb.on{border-color:var(--blue)}
.pickb svg{width:14px;height:14px;flex:none;stroke:var(--mute);fill:none;stroke-width:2}
#picker{position:fixed;inset:0;z-index:30;display:none}
#picker.on{display:block}
.pkbg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.pkbox{position:absolute;left:0;right:0;bottom:0;max-height:78vh;display:flex;flex-direction:column;background:#1b222c;box-shadow:0 -12px 40px rgba(0,0,0,.6);border-top:2px solid var(--blue);padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.pkhead{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 8px}
.pkhead b{font:700 18px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.pkx{width:36px;height:36px;border:0;background:none;color:var(--ice);display:grid;place-items:center}
.pkx svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.pks{margin-bottom:8px}
.pklist{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.pki{display:flex;align-items:center;gap:10px;width:100%;padding:9px 6px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ice);font:400 15px/1.2 var(--body);text-align:left;cursor:pointer}
.pki .lg{width:26px;height:26px} .pki .lg.flag{width:28px;height:19px}
.pki .pkl{flex:1;min-width:0} .pki em{font-style:normal;color:var(--mute);font-size:12.5px}
.pki .pkn{color:var(--mute);font-size:12.5px}
.pki.on{background:rgba(47,196,238,.12)} .pki.on .pkl{color:var(--blue);font-weight:600}
.pkc{padding:6px}
.antabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:4px;background:rgba(14,19,26,.6);border:1px solid var(--line);padding:4px}
.antabs::-webkit-scrollbar{display:none}
.antabs button{flex:1 0 auto;white-space:nowrap;padding-left:12px!important;padding-right:12px!important;border:0;background:none;color:var(--mute);padding:9px 2px;font:700 12.5px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.antabs button[aria-selected=true]{background:#fff;color:#0d1117}
.anlead{font-size:13px;color:var(--mute);margin:10px 0 12px}
.lsum{color:var(--ovr);font-weight:600;font-size:13px}
.bpbox{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.bpbox .seg{margin:0}
.bpm .mc{width:46px}
.bpr{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.bpr .mini{margin:0;flex-wrap:nowrap}
.bprt{min-width:0;display:flex;flex-direction:column;gap:4px}
.bprh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bprh .lsum{font-size:16px}
.bprt .btn.bpuse{align-self:flex-start;padding:5px 10px!important;font-size:11px!important;min-height:0!important;height:auto!important;margin-top:2px;border-radius:3px}
.pkcand{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pkc2{position:relative}
.pkc2 .mc,.pkr .mc{position:relative;width:58px;aspect-ratio:804/1128;padding:0;border:0;background:var(--surface2);overflow:hidden;display:block;cursor:pointer}
.pkc2 .mc img,.pkr .mc img{width:100%;height:100%;object-fit:cover;display:block}
.pkc2 .mc i{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);color:#fff;font:700 11px/1.5 var(--body);font-style:normal;text-align:center}
.pkdel{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#d6453d;color:#fff;display:grid;place-items:center;padding:0}
.pkdel svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round}
.pkadd{width:58px;aspect-ratio:804/1128;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--line2);background:rgba(255,255,255,.03);color:var(--mute);font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.pkadd span{font-size:24px;line-height:1;color:var(--ice)} .pkadd svg{width:22px;height:22px;stroke:var(--ice);fill:none;stroke-width:1.8}
.pkr{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pkr.best{box-shadow:inset 3px 0 0 var(--ovr);padding-left:8px}
.pkrn b{font-size:15px} .pkrs{font-size:12.5px;color:var(--mute);margin-top:3px}
.pkrs .dn{color:#ff6b62}
.pkrs b.up{color:var(--sal)} .pkrs b.dn{color:#ff6b62}
.pkimg{width:34px;aspect-ratio:804/1128;flex:none;overflow:hidden;background:var(--surface2)}
.pkimg img{width:100%;height:100%;object-fit:cover;display:block}
.lbslots{margin-bottom:8px}
.lbs{min-width:0;position:relative}
.lbs .kdel{position:absolute;top:4px;right:4px;z-index:2;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
.lbs .kdel svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.lbpick{width:100%}
.lbempty{width:100%;aspect-ratio:804/1128;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--line2);background:rgba(255,255,255,.03);color:var(--mute);font:700 14px/1 var(--display);letter-spacing:.1em;cursor:pointer}
.lbempty span{font-size:34px;line-height:1;color:var(--ice)}
.fit-h{font:700 17px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 8px}
.rstat b.up{color:var(--sal)!important} .rstat b.dn{color:#ff6b62!important}
.pkg{font:700 11.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:14px 6px 6px}
.fsel3 select{padding:8px 22px 8px 9px;font-size:13.5px;min-width:0;background-position:right 6px center}
.ovrr{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:2px 2px}
.ovrr b{font:700 14px/1 var(--display);letter-spacing:.06em;white-space:nowrap;min-width:84px}
.ovrr b span{color:var(--ovr)}
.dual{position:relative;height:28px}
.dual .trk{position:absolute;left:0;right:0;top:12px;height:4px;background:var(--line)}
.dual .fill{position:absolute;top:12px;height:4px;background:var(--ice)}
.dual input{position:absolute;inset:0;width:100%;height:28px;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--ice);cursor:pointer}
.dual input::-moz-range-thumb{pointer-events:auto;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--ice);cursor:pointer}
.dual input::-webkit-slider-runnable-track{background:transparent;height:28px;border:0}
.dual input::-webkit-slider-thumb{margin-top:2px}
.dual input::-moz-range-track{background:none}
.fsel select{padding:8px 22px 8px 9px;font-size:13.5px;min-width:0;background-position:right 6px center}
.fsel .chip{padding:0 12px;display:grid;place-items:center}
.logos{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:5px}
.lgi{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mute);min-width:0}
.lgi em{font-style:normal;white-space:nowrap}
.lg{width:20px;height:20px;object-fit:contain;flex:none}
.lg.flag{width:22px;height:15px;object-fit:cover;border-radius:1px}
.meta .sal{color:var(--sal)}

/* Eingaben */
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
input[type=search],input[type=number],input[type=text],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--line2);outline:none}
.searchwrap{position:relative}
.searchwrap svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--faint);fill:none;stroke-width:2}
.searchwrap input{padding-left:42px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:600 13px/1.2 var(--body);color:var(--mute);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ice);color:var(--bg);border-color:var(--ice)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Kartenliste */
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:border-color .15s,transform .1s}
.row.own{border-color:rgba(79,214,160,.45)}
.rowhead{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:8px 8px 8px 8px}
.art{position:relative;width:54px;aspect-ratio:804/1128;border-radius:6px;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ovr{font:700 22px/1 var(--display);color:var(--ovr);text-align:center;font-variant-numeric:tabular-nums}
.ovr small{display:block;font:600 10px/1.3 var(--display);color:var(--mute);letter-spacing:.08em}
.open{background:none;border:0;padding:4px 0;text-align:left;min-width:0;display:flex;flex-direction:column;gap:5px}
.nm{font:600 16px/1.2 var(--body);letter-spacing:-.005em;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.meta .sep{color:var(--faint)}
.badge-ovr{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;font:700 15px/1 var(--display);color:#1a1205;background:linear-gradient(160deg,var(--brz1),var(--brz2))}
.badge-ovr.t2{background:linear-gradient(160deg,var(--silv1),var(--silv2))}
.badge-ovr.t3{background:linear-gradient(160deg,var(--gold1),var(--gold2))}
.k{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);font:600 11px/1.6 var(--body);letter-spacing:.04em;color:var(--ice)}
.tag{display:inline-block;border-radius:5px;padding:0 6px;font:700 10px/1.7 var(--body);letter-spacing:.06em;text-transform:uppercase;margin-left:6px;vertical-align:2px}
.tag.fix{background:var(--ovr);color:var(--bg)} .tag.ban{background:var(--accent);color:#fff} .tag.new{background:var(--sal);color:var(--bg)}
.act{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);display:grid;place-items:center;color:var(--ice);flex:none}
.act svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.act.on{background:var(--sal);border-color:var(--sal);color:var(--bg)}
.act.del{color:var(--accent2)}

/* Pillen, Knoepfe */
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font:600 12.5px/1.4 var(--body);white-space:nowrap;background:rgba(255,255,255,.04);border:1px solid currentColor}
.pill.o{color:var(--ovr)} .pill.a{color:var(--ap)} .pill.s{color:var(--sal)} .pill.n{color:var(--faint);border-color:var(--line)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:600 15px/1.2 var(--body);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center;box-shadow:0 6px 16px -8px rgba(255,79,69,.7)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:var(--surface);border:1px solid var(--line2);color:var(--ice);box-shadow:none}
.btn.sm{padding:8px 14px;min-height:40px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:16px}

/* Kennzahlen */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.tile b{display:block;font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;margin-bottom:4px}
.tile span{color:var(--mute);font-size:12px;line-height:1.3;display:block}
.tile.o b{color:var(--ovr)} .tile.a b{color:var(--ap)} .tile.s b{color:var(--sal)} .tile.bad b{color:var(--accent)}

/* Reihen */
.line{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.linehead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linehead strong{font:600 14px/1 var(--body)}
.players{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.players.n5{grid-template-columns:repeat(5,1fr)} .players.n4{grid-template-columns:repeat(4,1fr)}
.kgrid{margin-bottom:6px}
.kt{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.kt img{-webkit-user-drag:none;pointer-events:none}
.kt.selmode .pl{opacity:.55;transition:opacity .15s,transform .15s}
.kt.sel .pl{opacity:1;transform:scale(.96)}
.kt.sel .pl .img{outline:3px solid var(--ice);outline-offset:-3px}
.kchk{position:absolute;top:6px;left:6px;z-index:2;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.55);display:grid;place-items:center;color:var(--bg)}
.kt.sel .kchk{background:var(--ice);border-color:var(--ice)}
.kchk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round}
.selbar{position:fixed;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px -8px rgba(0,0,0,.8)}
.selbar span{flex:1}
.btn.danger{background:#d6453d;border-color:#d6453d;color:#fff}
.btn[disabled]{opacity:.45}
.kt{position:relative;min-width:0}
.kt .kxf{display:flex;gap:3px;margin-top:4px}
.kt .kxf img{width:22px;height:22px}
.kt .kdel{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
.kt .kdel svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.kt .pl{width:100%}
.pl{min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit}
/* Knoepfe zentrieren ihren Inhalt sonst senkrecht: bei unterschiedlich langen Namen verrutschen die Bilder */
.pl,.slot,.ver{display:flex;flex-direction:column;justify-content:flex-start;align-self:start;align-items:stretch}
.pl .img{position:relative;aspect-ratio:804/1128;border-radius:8px;overflow:hidden;background:var(--surface2);margin-bottom:6px;display:grid;place-items:center}
.pl .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pl .img .ovr{font-size:28px}
.pl .boost{position:absolute;right:4px;bottom:4px;background:var(--ovr);color:var(--bg);font:700 11px/1 var(--body);padding:3px 5px;border-radius:5px}
.pl .n{font:600 13px/1.2 var(--body);overflow-wrap:anywhere}
.pl .v{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:1px}
.players.n5 .n,.players.n4 .n{font-size:11.5px}
.combo{font-size:12.5px;color:var(--mute);display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:4px}
.combo b{color:var(--ice);margin-left:2px}
.combo.dup{opacity:.6;font-size:11.5px}
.combo.dup s{color:var(--mute)}
.rq{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 3px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--ice);font-size:12px;white-space:nowrap;border-radius:2px}
.rq img{width:18px;height:18px;object-fit:contain}
.cmbi{display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap;padding:2px 6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:2px}
.rqi{width:22px;height:22px;object-fit:contain}
.rqt{font-size:11.5px;color:var(--ice);white-space:nowrap}
.amp,.plus{color:var(--faint);font-size:12px;margin:0 1px}
.k img{width:14px;height:14px;object-fit:contain;vertical-align:-2px;margin-right:3px}
.nmx{padding:10px 0;border-top:1px solid var(--line)} .nmx:first-of-type{border-top:0}
.nmh{display:flex;justify-content:space-between;align-items:center}
.nmslides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin-top:6px;scrollbar-width:none;overscroll-behavior-x:contain}
.nmslides::-webkit-scrollbar{display:none}
.nms{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.nmslides .nms+.nms{border-left:1px solid var(--line);padding-left:10px}
.nmx .mini .mc{width:40px}
.nmrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.nmout{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#ff6b62}
.nmout .mini{margin:0}
.nmarr{color:var(--faint);font-size:18px}
.nmin{flex:1;min-width:0}
.mini .mc{position:relative}
.mini .mc i{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);color:#fff;font:700 10px/1.4 var(--body);font-style:normal;text-align:center}
.mini .mc.own{outline:2px solid var(--sal);outline-offset:-2px}
.combo:before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--ovr);transform:translateY(-1px)}

/* Hinweise, Felder */
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ovr);padding:11px 14px;border-radius:10px;font-size:14px}
.note.warn{border-left-color:var(--accent)} .note.ok{border-left-color:var(--sal)} .note.ap{border-left-color:var(--ap)}
.note .chip{margin-left:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.lab{font:600 13px/1.2 var(--body);color:var(--ice)}
.field small{color:var(--faint);font-size:12.5px}
.check{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.center{text-align:center;padding:32px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
.center h2{justify-content:center;font-size:18px;letter-spacing:-.01em;text-transform:none;color:var(--ice);margin:8px 0 0}
.empty-ic{width:64px;height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.empty-ic svg{width:30px;height:30px;stroke:var(--accent2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:10px}
details>summary{padding:14px;font:600 14px/1.2 var(--body);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary:after{content:"";width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details[open]>summary:after{transform:rotate(-135deg)}
details>div{padding:0 14px 14px}
details.sg{margin-top:8px}
details.sg>summary{padding:11px 14px}
details.sg>summary>span{display:flex;flex-direction:column;gap:3px;min-width:0}
details.sg>summary small{font:400 12.5px/1.3 var(--body);color:var(--mute);text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.sg .field{margin-bottom:12px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.statgrid label{display:flex;flex-direction:column;gap:4px;font:600 11px/1.2 var(--body);letter-spacing:.06em;color:var(--mute)}
.statgrid input,.statgrid select{min-height:38px;padding:6px 10px}
.aprow{display:grid;grid-template-columns:22px 40px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.aprow.rec{box-shadow:inset 3px 0 0 var(--ovr);padding-left:6px}
.apimg{width:40px;aspect-ratio:804/1128;background:var(--surface2);overflow:hidden;display:block}
.apimg img{width:100%;height:100%;object-fit:cover;display:block}
.aptx{display:flex;flex-direction:column;gap:2px;min-width:0}
.apn{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.apn b{font-size:14.5px;font-weight:600}
.apn .xfi{width:18px;height:18px;align-self:center}
.apn em{font-style:normal;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.app{font-size:12.5px;color:var(--ice)}
.aps{display:flex;align-items:center;gap:8px;font-size:12px}
.aps .off{color:var(--faint)}
.recl{font:700 10.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ovr)}
.ape{font-size:11.5px;color:var(--mute);line-height:1.35}
.apc{display:flex;flex-direction:column;align-items:center;font:700 20px/1 var(--display);color:var(--ap);min-width:34px}
.apc small{font-size:10px;letter-spacing:.08em;color:var(--mute)}
.apbtns{margin:8px 0;flex-wrap:nowrap}
.apbtns .btn{flex:1;justify-content:center;padding:8px 10px;font-size:12.5px}
.aprow:first-child{border-top:0}
.aprow input{width:22px;height:22px;accent-color:var(--ap)}
.cmp{display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;gap:6px 10px;align-items:center;font-variant-numeric:tabular-nums}
.cmp .l{text-align:right} .cmp .m{color:var(--mute);font:500 12.5px/1.25 var(--body);text-align:center;max-width:170px}
.cmp .win{color:var(--ovr);font-weight:700}
.cmphead{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;text-align:center}
.cmphead>div{min-width:0}
.verdict{background:rgba(14,19,26,.7);border:1px solid var(--line);border-left:3px solid var(--ovr);padding:12px 14px;margin:0 0 14px}
.verdict .vh{font:700 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.verdict .vbig{margin:0 0 6px;font-size:16px} .verdict .vbig b{color:var(--ovr)}
.verdict ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ice)} .verdict li{margin:3px 0}
.cmphead .logos,.cmphead .meta{justify-content:center;flex-wrap:wrap}
.cmphead .lgi em{display:none}
.cmphead .lbempty{width:min(150px,100%);margin:0 auto}
.cmphead img{width:min(150px,100%);aspect-ratio:804/1128;border-radius:10px;background:var(--surface2);cursor:pointer}
.imprt{display:grid;grid-template-columns:auto 46px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.imprt .art{width:46px}
.imprt input{width:22px;height:22px;accent-color:var(--sal)}
progress{width:100%;height:8px;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:var(--ice);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;z-index:30;box-shadow:0 10px 30px -10px rgba(0,0,0,.7)}
#toast.on{opacity:1;transform:translateX(-50%)}
a{color:var(--blue)}
.hide{display:none}

/* Karten-Detailseite */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#sheet.on{transform:none;visibility:visible}
.sh-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:rgba(10,18,32,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.sh-top .ttl{flex:1;font:600 15px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ice);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hero{position:relative;overflow:hidden;padding:22px 16px 18px;text-align:center}
.hero .glow{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.4);opacity:.35;transform:scale(1.2)}
.hero .glow:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,var(--bg) 95%)}
.hero .cardimg{position:relative;width:min(230px,62vw);aspect-ratio:804/1128;margin:0 auto;border-radius:14px;overflow:hidden;background:var(--surface2);box-shadow:0 24px 48px -16px rgba(0,0,0,.8);display:grid;place-items:center}
.hero .cardimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .cardimg .ovr{font-size:56px}
.hero h2{position:relative;justify-content:center;font:700 26px/1.1 var(--body);letter-spacing:-.02em;text-transform:none;color:var(--ice);margin:18px 0 4px}
.hero .sub2{position:relative;color:var(--mute);font-size:14px}
.sh-body{padding:0 16px 40px;max-width:720px;margin:0 auto}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.kv b{display:block;font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kv span{font-size:11px;color:var(--faint);letter-spacing:.04em}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin-bottom:8px}
.facts dt{color:var(--faint)} .facts dd{margin:0;text-align:right}
.grp{margin-bottom:6px}
.grp-head{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.grp-head b{font:600 14px/1.2 var(--body)}
.grp-head span{font:700 18px/1 var(--display);color:var(--ovr)}
.bar{display:grid;grid-template-columns:1fr 36px;gap:10px;align-items:center;padding:4px 0}
.bar .lbl{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.bar .track{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar .fill{height:100%;border-radius:3px;background:var(--silv2)}
.bar .fill.hi{background:linear-gradient(90deg,var(--gold2),var(--gold1))}
.bar .fill.md{background:linear-gradient(90deg,#3d7fb8,var(--blue))}
.bar .val{font:700 17px/1 var(--display);text-align:right;font-variant-numeric:tabular-nums}
.stars{color:var(--ovr);letter-spacing:1px}
.xf{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.xf:first-child{border-top:0;padding-top:4px}
.xf img{width:44px;height:44px;border-radius:10px;background:var(--surface2)}
.xf b{font-weight:600}
.xf p{margin:4px 0 0;font-size:13px;color:var(--mute)}
.versions{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}
.versions::-webkit-scrollbar{display:none}
.ver{flex:none;width:96px;background:none;border:0;padding:0;color:inherit;text-align:left}
.ver .img{position:relative;aspect-ratio:804/1128;border-radius:8px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;margin-bottom:6px}
.ver .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ver small{display:block;font-size:12px;color:var(--mute)}
body.sheet-open{overflow:hidden}

/* Aufstellung auf einen Blick, aufgebaut wie der Bildschirm im Spiel */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{background:none;border:0;border-radius:9px;padding:8px 6px;font:600 13.5px/1.2 var(--body);color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ice);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
/* Spielbildschirm nachgebaut: Masse relativ zur Breite (cqw), damit es klein und im Vollbild gleich aussieht */
.gm{container-type:inline-size;position:relative;border-radius:14px;overflow:hidden;margin-bottom:6px;
  background:
    repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px),
    radial-gradient(90% 70% at 30% 20%,rgba(120,140,165,.28),transparent 70%),
    linear-gradient(160deg,#3a4554 0%,#28313d 45%,#1c232d 100%)}
.gm{--cw:13.4cqw;--bw:9.2cqw}
.gm-in{display:grid;grid-template-columns:2.6cqw repeat(3,var(--cw)) var(--bw) 2.6cqw repeat(2,var(--cw)) 9.2cqw;justify-content:center;grid-auto-rows:auto;column-gap:1cqw;row-gap:1.6cqw;padding:2.2cqw 1.4cqw 2.6cqw 1.2cqw;align-items:end}
.gm .side{writing-mode:vertical-rl;transform:rotate(180deg);font:700 2.3cqw/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:#e9eef4;text-align:center;align-self:center;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.gm .slot{width:100%;display:flex;flex-direction:column;align-items:stretch;background:none;border:0;padding:0;color:inherit;min-width:0;position:relative;z-index:1}
.gm .pos{font:600 2.5cqw/1 var(--display);color:#dfe5ec;text-align:center;margin-bottom:.8cqw;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.gm .img{position:relative;aspect-ratio:804/1128;overflow:hidden;background:rgba(0,0,0,.25);display:grid;place-items:center;box-shadow:0 1.2cqw 2.4cqw -1cqw rgba(0,0,0,.75)}
.gm .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gm .img .ovr{font-size:4cqw;color:#fff}
.gm .empty .img{background:transparent;border:.25cqw dashed rgba(255,255,255,.25);box-shadow:none}
.gm .capt{position:absolute;top:-1.4cqw;right:-1cqw;width:4.2cqw;height:4.8cqw;z-index:2;filter:drop-shadow(0 .4cqw .6cqw rgba(0,0,0,.6))}
.gm .bon{display:flex;flex-direction:column;justify-content:center;gap:1.4cqw;align-self:center;margin:0;padding-left:.4cqw;min-height:0;position:relative;z-index:1}
.gm .bon span{display:flex;align-items:center;gap:.6cqw;border-left:.3cqw solid #33c8f0;padding:.2cqw 0 .2cqw .8cqw;background:none;border-radius:0;font:700 2.35cqw/1 var(--display);letter-spacing:.01em;white-space:nowrap}
.gm .bon .o{color:#7fe4ff} .gm .bon .s{color:#d9f3b4} .gm .bon .a{color:#b9c2ff}
.gm .bon svg{width:1.7cqw;height:2.2cqw;flex:none}
/* Lichtstreifen hinter einer Reihe mit Bonus, je Bonus eine Farbe wie im Spiel */
.gm .band{align-self:center;margin-top:3.2cqw;height:62%;z-index:0;pointer-events:none;position:relative;display:flex;flex-direction:column;justify-content:center;gap:1.6cqw}
.gm .band:before{content:"";position:absolute;inset:8% -2% 8% 0;background:radial-gradient(60% 50% at 35% 50%,rgba(80,190,240,.28),transparent 75%);filter:blur(1.4cqw)}
.gm .band i{display:block;height:1.1cqw;border-radius:1cqw;filter:blur(.45cqw);opacity:.95;
  background:linear-gradient(90deg,transparent 0%,var(--c) 8%,var(--c2) 26%,var(--c) 55%,var(--c2) 88%,transparent 100%)}
.gm .band i.o{--c:rgba(80,205,255,.55);--c2:rgba(170,240,255,.95)}
.gm .band i.s{--c:rgba(190,235,120,.5);--c2:rgba(225,250,190,.9)}
.gm .band i.a{--c:rgba(150,140,255,.5);--c2:rgba(205,200,255,.9)}
.gm .grp{display:contents}
.gm .cell{position:relative}
.gm-row{display:contents}
.legend{font-size:11.5px;color:var(--faint);margin:6px 0 0}
.gm .star{position:absolute;top:-1.4cqw;right:-1cqw;width:4.2cqw;height:4.8cqw;z-index:2;filter:drop-shadow(0 .4cqw .6cqw rgba(0,0,0,.6))}
/* Bedingungen fuer Captain- und Trainer-Boni */
/* Vorschlag: neue Reihe mit Partnern und Reihenbonus vorher/nachher */
.sug-line{display:flex;gap:6px;margin-top:8px}
.sug-line .m{width:44px;flex:none;background:none;border:0;padding:0;color:inherit;text-align:center}
.sug-line .m .img{position:relative;aspect-ratio:804/1128;border-radius:4px;overflow:hidden;background:var(--surface2);display:grid;place-items:center}
.sug-line .m .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sug-line .m .img .ovr{font-size:15px}
.sug-line .m.new .img{outline:2px solid var(--sal);outline-offset:1px}
.sug-line .m small{display:block;font-size:10px;line-height:1.15;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-line .m.new small{color:var(--sal);font-weight:600}
.sug-line .sep{width:1px;align-self:stretch;margin:2px 4px 18px;background:var(--line2)}
.sug-line .m.out .img{outline:2px solid var(--accent);outline-offset:1px}
.sug-line .m.out .img img{filter:grayscale(.85) brightness(.6)}
.sug-line .m.out .img:after{content:"";position:absolute;left:-10%;right:-10%;top:50%;height:2px;background:var(--accent);transform:rotate(-55deg)}
.sug-line .m.out small{color:var(--accent2);font-weight:600;white-space:normal;overflow-wrap:anywhere}
.sug-line .m.out{width:52px}
.sug-bon{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin-top:8px;font-size:12px;color:var(--faint)}
.sug-bon .pills{gap:4px}
.sug-bon .pill{font-size:11.5px;padding:1px 8px}
.req{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.req>div:nth-child(2){display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;min-width:0}
.req>div:nth-child(2) p{margin:0;width:100%}
.req .rw,.req .need{margin-top:0}
.req .rq{font-size:11.5px;padding:1px 5px 1px 2px} .req .rq img{width:15px;height:15px}
.req .st{font-size:11.5px;padding:4px 7px}
.req .rw .pill,.req .pill{font-size:10.5px;padding:2px 5px}
.req b{font-size:14px} .req .pill{font-size:11px;padding:2px 6px;margin-left:4px}
.req .rw .pill{margin-left:0}
.req .ic.face{width:30px;height:42px;padding:0;overflow:hidden;background:none}
.req .ic.face img{width:100%;height:100%;object-fit:cover}
.req .need{gap:3px}
.req .need .k{font-size:10.5px;padding:0 5px;line-height:1.7}
.req .need .k img{width:12px;height:12px}
.reqh{font:700 11.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:10px 0 0;border-top:1px solid var(--line)}
.reqh+.req{border-top:0}

  <a href="#kader" data-tab="kader"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.8 14.3c2.2.2 3.9 1.8 4.6 4.7"/></svg><span>Kader</span><i class="badge" id="n-kader"></i></a>

<script src="engine.js?v=__BUILD__"></script>
<script>
(function(){
'use strict';
var D=null, byKey={}, byName={}, teamName={}, typeName={};
var S={cap:'', ap:'', coach:'', strict:true, dHand:'', game:'', upMax:'', upTol:'3', prio:'bal', seenNewer:0, captain:'auto', useRating:false,
       weights:{ovr:1,skating:1,shooting:1,hands:1,checking:1,defense:1,size:0,gsize:0}, lastSeen:'', prevSeen:''};
var VERSIONS=null; var VD={}, VER='', V={owned:[],locks:{},bans:{},lineups:[],xfOn:{}};  /* Daten je NHL-Version */
var SHARED=null;   /* geteilter Kader aus einem Link: nur ansehen */
var RES=null;      /* letzte Optimierung, wird bei jeder Aenderung verworfen */
var UI={q:'', pos:'', type:'', min:'', sort:'ovr', limit:40, open:null, stat:{}, xf:'', hgt:'', hand:'', onlyNew:false, onlyMine:false,
        more:false, cmp:[], saved:-1, up:null, upMin:'', upMode:'bonus', upMax:'', upTol:'3', imp:null};
var PRIO={bal:{ovr:1,ap:0.5,sal:0.25,label:'Ausgewogen'}, ovr:{ovr:1,ap:0.3,sal:0.1,label:'Stärkste Reihen'},
          ap:{ovr:1,ap:2,sal:0.25,label:'Möglichst viele Ability Points'}, sal:{ovr:1,ap:0.5,sal:1.5,label:'Möglichst viel Cap-Bonus'}};
var SA=['ACC','AGI','BAL','END','SPD','SSA','SSP','WSA','WSP','DEK','OAW','HAE','PAS','PC','CHK','STR','AGR','DUR','FS','DAW','BLK','SCH','FO','DIS'];
var SAL=['Beschleunigung','Beweglichkeit','Balance','Ausdauer','Tempo','Schlagschuss Präzision','Schlagschuss Härte','Handgelenkschuss Präzision','Handgelenkschuss Härte','Deking','Offensiv-Übersicht','Hand-Auge-Koordination','Passen','Puckkontrolle','Bodycheck','Stärke','Aggressivität','Robustheit','Faustkampf','Defensiv-Übersicht','Schüsse blocken','Stockcheck','Bullys','Disziplin'];
var GA=['GH','SH','GL','PK','SL','PAS','SPD','VIS','END','AGI','POS','5H','BRK','REC','AGR','RBC','DUR'];
var GRP={skating:'Skating',shooting:'Schuss',hands:'Hände',checking:'Checking',defense:'Defensive'};
var view=document.getElementById('view');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function key(c){return c.k+c.id;}
function money(v){return '$'+(Math.round(v*10)/10).toFixed(1)+'M';}
function tab(){var h=(location.hash||'').replace('#','');return ['karten','kader','reihen','analyse','setup'].indexOf(h)>=0?h:'karten';}
function toast(t){var el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(function(){el.classList.remove('on');},2600);}

function load(){
  try{
    var r=JSON.parse(localStorage.getItem('hutkader')||'null');
    if(r){
      for(var k in S) if(r[k]!==undefined) S[k]=r[k];
      VD=r.v||{};
      if(r.rosters) for(var ver in r.rosters) if(!VD[ver]) VD[ver]={owned:r.rosters[ver]};   // Format der Vorversion
    }else{
      var o=JSON.parse(localStorage.getItem('hut27')||'null');
      if(o){for(var j in S) if(o[j]!==undefined) S[j]=o[j]; if(o.owned&&o.owned.length) VD['27']={owned:o.owned};}
    }
  }catch(e){}
}
function save(){
  RES=null;
  if(VER) VD[VER]=V;
  var out={v:VD}; for(var k in S) out[k]=S[k];
  try{localStorage.setItem('hutkader',JSON.stringify(out));}catch(e){}
  count();
}
function count(){var n=(SHARED||V.owned).length; document.getElementById('n-kader').textContent=n?String(n):'';}
/* "JOE SAKIC" -> "Joe Sakic", "RYAN MCDONAGH" -> "Ryan McDonagh" */
function nice(n){return String(n||'').toLowerCase().replace(/(^|[\s\-'.])(\p{L})/gu,function(m,a,b){return a+b.toUpperCase();}).replace(/\bMc(\p{L})/gu,function(m,x){return 'Mc'+x.toUpperCase();});}
function tier(o){return o>=90?' t3':o>=84?' t2':'';}
var IC={
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  filter:'<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  image:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
  camera:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  text:'<svg viewBox="0 0 24 24"><path d="M8 4h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>',
  share:'<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>',
  pin:'<svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/></svg>',
  ban:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/></svg>',
  lines:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  cmp:'<svg viewBox="0 0 24 24"><path d="M8 4v16M16 4v16M4 8h4M16 16h4"/></svg>',
  cards:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="12" height="16" rx="2"/><path d="M8 21h10a2 2 0 0 0 2-2V7"/></svg>',
  people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.8 14.3c2.2.2 3.9 1.8 4.6 4.7"/></svg>'
};
function owned(){return (SHARED||V.owned).map(function(k){return byKey[k];}).filter(Boolean);}
function isOwned(c){return (SHARED||V.owned).indexOf(key(c))>=0;}
function valFn(){return S.useRating?HUT.rating(S.weights):function(p){return p.ovr;};}
function opts(){return {coach:S.coach,strict:S.strict,cap:parseFloat(S.cap)||0,w:PRIO[S.prio]||PRIO.bal,val:valFn(),locks:SHARED?{}:V.locks,bans:SHARED?{}:V.bans,captain:S.captain,dHand:S.dHand,forceCaptain:S.forceCap!==false};}
function result(){ if(!RES) RES=HUT.optimize(D,owned(),opts()); return RES; }
function newSince(){
  if(S.prevSeen) return S.prevSeen;
  var d=new Date(D.meta.updated); d.setDate(d.getDate()-7); return d.toISOString().slice(0,10);
}
function inches(h){var m=/(\d+)'\s*(\d+)/.exec(h||''); return m?(+m[1])*12+(+m[2]):0;}

function sub(c){
  var v=S.useRating&&c.k==='s'?'<span class="sep">·</span><span>Wert '+valFn()(c).toFixed(1)+'</span>':'';
  var ct=(D.lists.card_type.filter(function(x){return String(x.id)===String(c.ct);})[0]||{});
  return '<span class="meta"><span class="badge-ovr'+tier(c.ovr)+'">'+c.ovr+'</span><span class="k">'+esc(c.pos)+(c.hand?' '+c.hand:'')+'</span><span class="sal">'+money(c.sal||0)+'</span>'+v+'</span>'+
    '<span class="logos">'+(c.nat?'<span class="lgi">'+lg(natLogo(c.nat),c.nat,'lg flag')+'</span>':'')+
    '<span class="lgi">'+lg(logoOf('team',c.tm),c.tmn)+'<em>'+esc(c.tmn)+'</em></span>'+
    (ct.logo?'<span class="lgi">'+lg(ct.logo,ct.name||c.ctn)+'<em>'+esc(ct.name||c.ctn)+'</em></span>':'<span class="lgi"><em>'+esc(c.ctn)+'</em></span>')+'</span>';
}
/* Kartenbild direkt von der Quelle, erst beim Scrollen geladen. Laedt es nicht, bleibt die OVR-Zahl stehen. */
function img(c,cls){
  if(!c.art||!D.meta.img_base) return '';
  return '<img'+(cls?' class="'+cls+'"':'')+' src="'+esc(D.meta.img_base+c.art)+'" alt="Karte '+esc(nice(c.n))+' '+c.ovr+'" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">';
}
function tags(c){
  var k=key(c), t='';
  if(!SHARED&&V.locks[k]) t+='<span class="tag fix">fix</span>';
  if(!SHARED&&V.bans[k]) t+='<span class="tag ban">gesperrt</span>';
  if(c.add>newSince()) t+='<span class="tag new">neu</span>';
  return t;
}
function artHtml(c,cls){
  return '<div class="'+(cls||'art')+'" data-card="'+key(c)+'"><div class="ovr">'+c.ovr+'<small>'+esc(c.pos)+'</small></div>'+img(c)+'</div>';
}
function rowHtml(c, mode){
  var k=key(c), own=isOwned(c);
  var btn = mode==='kader'
    ? '<button class="act del" data-rm="'+k+'" aria-label="'+esc(nice(c.n))+' aus dem Kader entfernen">'+IC.x+'</button>'
    : '<button class="act'+(own?' on':'')+'" data-tg="'+k+'" aria-pressed="'+own+'" aria-label="'+esc(nice(c.n))+(own?' aus dem Kader entfernen':' zum Kader hinzufügen')+'">'+(own?IC.check:IC.plus)+'</button>';
  return '<div class="row'+(own&&mode!=='kader'?' own':'')+'">'+
    '<div class="rowhead">'+artHtml(c)+
    '<button class="open" data-card="'+k+'" aria-label="Details zu '+esc(nice(c.n))+'"><span class="nm">'+esc(nice(c.n))+tags(c)+'</span>'+sub(c)+'</button>'+btn+'</div></div>';
}
function xfPill(id){
  var x=D.xf&&D.xf[id]; if(!x) return '<span class="pill a">X-Factor '+id+'</span>';
  return '<span class="pill a" title="'+esc(x.d)+'">'+esc(nice(x.n))+' · '+esc(x.t)+' · '+x.ap+' AP</span>';

function findSlot(r,k){
  var f=-1,d=-1,g=-1;
  r.forwards.forEach(function(l,i){ if(l.players.some(function(p){return key(p)===k;})) f=i; });
  r.defense.forEach(function(l,i){ if(l.players.some(function(p){return key(p)===k;})) d=i; });
  r.goalies.forEach(function(p,i){ if(key(p)===k) g=i; });
  return f>=0?{t:'f',i:f}:d>=0?{t:'d',i:d}:g>=0?{t:'g',i:g}:null;
}

  if(!at) return '<p class="note warn">Die Karte passt mit deinen Einstellungen nicht in die Aufstellung (z. B. feste Positionen).</p>';

function xfWeights(r){
  var w={};
  r.forwards.forEach(function(l,i){l.players.forEach(function(p){w[key(p)]=[1,.85,.7,.55][i]||.5;});});
  r.defense.forEach(function(l,i){l.players.forEach(function(p){w[key(p)]=[1,.85,.7][i]||.5;});});

function xfScore(p,info,w){
  var m=XFV[info.n]; if(!m) return 0;
  var g=p.pos==='G', role=g?'G':(p.pos==='LD'||p.pos==='RD')?'D':'F';
  if(g!==(m[2]==='G')) return 0;
  var posf=m[2]==='C'?(p.pos==='C'?1:.3):m[2].charAt(0)===role?1:m[2].indexOf(role)>=0?.75:.4;
  var fit=1;
  if(m[1].length&&p.a){ var avg=m[1].reduce(function(s,i){return s+(p.a[i]||70);},0)/m[1].length; fit=.6+.4*Math.max(0,Math.min(1,(avg-70)/28)); }
  return Math.round(m[0]*posf*fit*(XFT[info.t]||1)*(w[key(p)]||.5)*10)/10;
}

/* Rucksack: beste Summe der Werte, die ins AP-Budget passt */
function xfBest(items,budget){
  budget=Math.max(0,Math.floor(budget)); var dp=[[]], val=[0];
  for(var b=1;b<=budget;b++){dp[b]=[];val[b]=0;}
  items.forEach(function(it,ix){ if(it.sc<=0) return;
    for(var b=budget;b>=it.ap;b--){ if(val[b-it.ap]+it.sc>val[b]){val[b]=val[b-it.ap]+it.sc; dp[b]=dp[b-it.ap].concat([ix]);} } });
  var bi=0; for(var b2=0;b2<=budget;b2++) if(val[b2]>val[bi]) bi=b2;
  var out={}; dp[bi].forEach(function(ix){out[items[ix].id]=1;}); return out;
}

/* ---------- Kader aus Screenshot oder Foto ---------- */
var NAMES=null, SUR={};
function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();}
function buildNames(){
  if(NAMES) return;
  NAMES=[];
  Object.keys(byName).forEach(function(n){
    var t=norm(n).split(' '); if(!t.length) return;
    var e={n:n,toks:t,last:t[t.length-1],first:t[0],max:Math.max.apply(null,byName[n].map(function(c){return c.ovr;}))};
    NAMES.push(e); (SUR[e.last]=SUR[e.last]||[]).push(e);
  });
}
function near1(a,b){ // hoechstens ein Zeichen Unterschied
  if(a===b) return true;
  var la=a.length, lb=b.length; if(Math.abs(la-lb)>1) return false;
  var i=0,j=0,d=0;
  while(i<la&&j<lb){ if(a[i]===b[j]){i++;j++;continue;} if(++d>1) return false; if(la>lb) i++; else if(lb>la) j++; else {i++;j++;} }
  return d+(la-i)+(lb-j)<=1;
}
var STOP={HOCKEY:1,ULTIMATE:1,TEAM:1,TEAMS:1,LINEUP:1,LINE:1,LINES:1,SALARY:1,OVERALL:1,COACH:1,CAPTAIN:1,FORWARD:1,FORWARDS:1,DEFENSE:1,GOALIE:1,GOALIES:1,
  ABILITY:1,POINTS:1,CHEMISTRY:1,COMBO:1,COMBOS:1,BOOST:1,ACTIVE:1,PLAYER:1,PLAYERS:1,ROSTER:1,EDIT:1,BACK:1,SELECT:1,OPTIONS:1,POWER:1,PLAY:1,PENALTY:1,KILL:1,
  EXTRA:1,ATTACKER:1,SHOOTOUT:1,STARTER:1,BACKUP:1,CENTER:1,WING:1,LEFT:1,RIGHT:1,ITEM:1,ITEMS:1,COLLECTION:1,MARKET:1,AUCTION:1,HOUSE:1,PACKS:1,STORE:1,HOME:1};
function matchText(text){
  buildNames();
  var lines=text.split(/\n/).map(norm), surs=Object.keys(SUR), found=[], seen={};
  var numsOf=function(l){return ((l||'').match(/\b[6-9]\d\b/g)||[]).map(Number);};
  lines.forEach(function(line,li){
    if(!line) return;
    var toks=line.split(' '), hits=[];
    toks.forEach(function(t,ti){
      if(t.length<4||/\d/.test(t)||STOP[t]) return;
      var group=SUR[t], fuzzy=false;
      if(!group&&t.length>=6){ for(var i=0;i<surs.length;i++){ if(near1(t,surs[i])){group=SUR[surs[i]]; fuzzy=true; break;} } }
      if(group) hits.push({t:t,ti:ti,group:group,fuzzy:fuzzy});
    });
    if(!hits.length) return;
    var prev=numsOf(lines[li-1]), next=numsOf(lines[li+1]), any=prev.concat(numsOf(line),next);
    hits.forEach(function(h,hi){
      // Die OVR-Zahl, die am ehesten zu diesem Namen gehoert: gleiche Zeile (naechste Zahl), sonst gleiche Spalte in der Zeile darueber oder darunter
      var main=null, best=99;
      toks.forEach(function(x,xi){ if(/^[6-9]\d$/.test(x)&&Math.abs(xi-h.ti)<best){best=Math.abs(xi-h.ti); main=+x;} });
      if(main===null&&prev.length===hits.length) main=prev[hi];
      if(main===null&&next.length===hits.length) main=next[hi];
      var group=h.group;
      var strong=group.filter(function(e){return e.toks.length>1&&toks.indexOf(e.first)>=0;});
      var initial=group.filter(function(e){return toks.some(function(x){return x.length===1&&x===e.first[0];});});
      var pick=strong.length?strong:(initial.length?initial:group);
      pick=pick.slice().sort(function(a,b){return b.max-a.max;});
      if(seen[pick[0].n]) return; seen[pick[0].n]=1;
      var cards=[]; pick.slice(0,4).forEach(function(e){byName[e.n].forEach(function(c){cards.push(c);});});
      var rank=function(c){return c.ovr===main?2:(any.indexOf(c.ovr)>=0?1:0);};
      cards.sort(function(a,b){return rank(b)-rank(a)||b.ovr-a.ovr;});
      var hit=rank(cards[0])>0;
      found.push({cards:cards.slice(0,24),sel:key(cards[0]),on:(strong.length>0||hit||(!h.fuzzy&&h.t.length>=5))&&!isOwned(cards[0]),sure:hit,token:h.t});
    });
  });
  return found;
}
var SCAN_URL='https://vbdgynxlcwuavhzakysy.supabase.co/functions/v1/hut-scan';
function prepImage(file){ // verkleinern und als JPEG kodieren, damit der Upload klein bleibt
  return new Promise(function(ok,no){
    var url=URL.createObjectURL(file), im=new Image();
    im.onload=function(){
      var sc=Math.min(1, 1800/Math.max(im.width,im.height));
      var c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg',0.85).split(',')[1]);
    };
    im.onerror=function(){URL.revokeObjectURL(url); no(new Error('Das Bild konnte nicht gelesen werden.'));};
    im.src=url;
  });
}
var SCAN_CTRL=null;
function scanImage(b64){
  SCAN_CTRL=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){ if(SCAN_CTRL) SCAN_CTRL.abort(); },150000);
  return fetch(SCAN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64,mime:'image/jpeg'}),signal:SCAN_CTRL?SCAN_CTRL.signal:undefined})
    .finally(function(){clearTimeout(to);})
    .then(function(r){return r.json().catch(function(){return {error:'HTTP '+r.status};}).then(function(j){ if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status)); return j.cards||[]; });},
          function(e){ if(e&&e.name==='AbortError') throw new Error(UI.imp&&UI.imp.cancel?'Abgebrochen.':'Gemini hat zu lange gebraucht. Versuch es gleich noch einmal.'); throw new Error('Keine Verbindung zum Scan-Dienst. Für das Einlesen brauchst du Internet.');});
}
var POSMAP={LA:'LW',RA:'RW',LV:'LD',RV:'RD',LF:'LW',RF:'RW',D:'',F:'',TW:'G',GK:'G'};
/* Karten zu einem gelesenen Namen finden: voller Name, sonst Nachname (mit Vornamen-Initiale), sonst ein Tippfehler Abstand */
function cardsForName(name){
  buildNames();
  var t=norm(name).split(' ').filter(Boolean); if(!t.length) return [];
  var full=t.join(' '), hit=NAMES.filter(function(e){return e.toks.join(' ')===full;});
  if(!hit.length){
    var last=t[t.length-1], group=SUR[last];
    if(!group&&last.length>=5){var surs=Object.keys(SUR); for(var i=0;i<surs.length;i++) if(near1(last,surs[i])){group=SUR[surs[i]]; break;}}
    if(!group&&t.length>1){ // Nachname zuerst gelesen, z. B. "BERTUZZI TYLER"
      group=SUR[t[0]]; if(group) t=t.slice(1).concat([t[0]]);
    }
    if(group){
      var first=t.length>1?t[0]:'';
      var exactFirst=group.filter(function(e){return first&&e.first===first;});
      var nearFirst=group.filter(function(e){return first&&(e.first[0]===first[0]);});
      hit=exactFirst.length?exactFirst:(nearFirst.length?nearFirst:group);
    }
  }
  var cards=[]; hit.forEach(function(e){byName[e.n].forEach(function(c){cards.push(c);});});
  return cards;
}
function matchScan(list){
  var found=[], seen={};
  list.forEach(function(it){
    var cards=cardsForName(it.name||''); if(!cards.length){found.push({cards:[],token:it.name,ovr:it.ovr,on:false}); return;}
    var shown=+it.ovr||0, pos=String(it.pos||'').toUpperCase(); pos=POSMAP[pos]!==undefined?POSMAP[pos]:pos;
    // Im Spiel steht die OVR inklusive Reihen-Bonus, deshalb auch 1 bis 2 Punkte darunter zulassen
    var score=function(c){var d=shown-c.ovr; var s=d===0?10:d===1?8:d===2?6:d===-1?3:0; if(pos&&c.pos===pos) s+=2; if(pos==='G'&&c.k==='g') s+=2; return s;};
    cards.sort(function(a,b){return score(b)-score(a)||b.ovr-a.ovr;});
    var best=cards[0], k=key(best); if(seen[k]) return; seen[k]=1;
    found.push({cards:cards.slice(0,24),sel:k,on:!isOwned(best),sure:score(best)>=8,token:it.name,ovr:shown,line:it.line||''});
  });
  return found;
}
function runImport(files){

/* ---------- Steuerung ---------- */
function render(){
  var t=tab();
  if(t!=='kader') UI.sel=null;
  Array.prototype.forEach.call(document.querySelectorAll('nav a'),function(a){ if(a.dataset.tab===t) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  count();
  if(!D) return;
  try{
    if(typeof HUT.sidesD!=='function') throw new Error('Veraltete App-Dateien im Speicher');
    ({karten:viewKarten,kader:viewKader,reihen:viewReihen,analyse:viewAnalyse,setup:viewSetup})[t]();
  }catch(err){
    view.innerHTML='<div class="center"><h2>Diese Ansicht konnte nicht geladen werden</h2><p class="mute">'+esc(err&&err.message)+'</p><button class="btn" id="hard-reload">App neu laden</button></div>';
  }
}
function isOwnedKey(k){return V.owned.indexOf(k)>=0;}
function askRemove(k){
  var c=byKey[k];
  return window.confirm((c?nice(c.n)+' ('+c.ovr+', '+c.pos+')':'Diese Karte')+' wirklich aus dem Kader entfernen?');
}
function toggle(k){
  if(SHARED){toast('Geteilter Kader: nur ansehen'); return false;}
  var i=V.owned.indexOf(k);
  if(i>=0){V.owned.splice(i,1); delete V.locks[k]; delete V.bans[k];} else V.owned.push(k);
  UI.up=null; save(); return true;
}
function lineupInfo(r){return 'Ø '+r.totals.avg.toFixed(1)+' · +'+r.totals.ap+' AP · '+money(r.totals.sal);}

var LP={t:0,x:0,y:0,fired:false};
document.addEventListener('pointerdown',function(e){
  var kt=e.target.closest&&e.target.closest('[data-kt]'); if(!kt||SHARED||tab()!=='kader'||e.target.closest('.kdel')) return;
  LP.x=e.clientX; LP.y=e.clientY; clearTimeout(LP.t);
  LP.t=setTimeout(function(){ LP.fired=true; if(!UI.sel) UI.sel={}; UI.sel[kt.dataset.kt]=1; try{navigator.vibrate&&navigator.vibrate(25);}catch(_){}
    viewKader(); },480);
});
document.addEventListener('pointermove',function(e){ if(LP.t&&(Math.abs(e.clientX-LP.x)>10||Math.abs(e.clientY-LP.y)>10)){clearTimeout(LP.t);LP.t=0;} });
['pointerup','pointercancel'].forEach(function(ev){document.addEventListener(ev,function(){clearTimeout(LP.t);LP.t=0; if(LP.fired) setTimeout(function(){LP.fired=false;},400);});});
document.addEventListener('contextmenu',function(e){ if(e.target.closest&&e.target.closest('[data-kt]')) e.preventDefault(); });
document.addEventListener('click',function(e){
  if(LP.fired){ LP.fired=false; e.preventDefault(); e.stopPropagation(); return; }
  var kt=UI.sel&&e.target.closest('[data-kt]');
  if(kt){ e.preventDefault(); var kk=kt.dataset.kt; if(UI.sel[kk]) delete UI.sel[kk]; else UI.sel[kk]=1; viewKader(); return; }
  var cardEl=e.target.closest('[data-card]');
  if(cardEl&&!e.target.closest('[data-tg],[data-rm],input,select')){ e.preventDefault(); if(document.getElementById('gmfull')&&document.getElementById('gmfull').classList.contains('on')) closeFull(); openCard(cardEl.dataset.card); return; }
  var b=e.target.closest('button'); if(!b) return;
  if(b.id==='gm-close'){closeFull(); return;}
  if(b.id==='gm-full'){openFull(); return;}
  if(!(view.contains(b)||sheet.contains(b))) return;
  var d=b.dataset;
  if(d.close){closeCard(); return;}
  if(d.tg){ if(!SHARED&&isOwnedKey(d.tg)&&!askRemove(d.tg)) return; if(toggle(d.tg)){ if(tab()==='karten') results(); else render(); refreshSheet(); } return; }
  if(d.fit){ var fe=document.getElementById('fit'); if(fe){ fe.innerHTML='<p class="small mute">Rechne …</p>'; setTimeout(function(){ fe.innerHTML=fitHtml(d.fit); fe.scrollIntoView({behavior:'smooth',block:'start'}); },30); } return; }
  if(d.rm){ if(!askRemove(d.rm)) return; toggle(d.rm); render(); return;}
  if(b.id==='sel-cancel'){UI.sel=null; viewKader(); return;}
  if(b.id==='sel-all'){owned().forEach(function(c){UI.sel[key(c)]=1;}); viewKader(); return;}
  if(b.id==='sel-del'){ var ks=Object.keys(UI.sel); if(!ks.length) return;
    if(!window.confirm(ks.length+(ks.length===1?' Karte':' Karten')+' wirklich aus dem Kader entfernen?\n\n'+ks.map(function(k){var c=byKey[k]; return c?nice(c.n)+' ('+c.ovr+')':k;}).join(', '))) return;
    ks.forEach(function(k){var i=V.owned.indexOf(k); if(i>=0){V.owned.splice(i,1); delete V.locks[k]; delete V.bans[k];}});
    UI.sel=null; UI.up=null; RES=null; save(); render(); toast(ks.length+' entfernt'); return; }
  if(d.cmp){
    UI.cmp=UI.cmp.filter(Boolean);
    if(UI.cmp.indexOf(d.cmp)<0){ if(UI.cmp.length>=2) UI.cmp.shift(); UI.cmp.push(d.cmp); }
    if(UI.cmp.length===2){closeCard(); UI.an='cmp'; setTimeout(function(){location.hash='#analyse';},50);} else toast('Gemerkt. Jetzt die zweite Karte öffnen.');
    return;
  }
  if(d.cmpx!==undefined){UI.cmp[+d.cmpx]=null; viewAnalyse(); return;}
  if(d.cmppick!==undefined){ var ci=+d.cmppick; openCardPick(0,function(k){ UI.cmp[ci]=k; viewAnalyse(); },true); return; }
  if(d.lock){ if(V.locks[d.lock]) delete V.locks[d.lock]; else {V.locks[d.lock]=1; delete V.bans[d.lock];} save(); render(); refreshSheet(); toast(V.locks[d.lock]?'Fixiert: spielt immer':'Fixierung gelöst'); return; }
  if(d.ban){ if(V.bans[d.ban]) delete V.bans[d.ban]; else {V.bans[d.ban]=1; delete V.locks[d.ban];} save(); render(); refreshSheet(); toast(V.bans[d.ban]?'Gesperrt: spielt nie':'Sperre gelöst'); return; }
  if(d.pos!==undefined){UI.pos=d.pos; UI.limit=40; viewKarten(); return;}
  if(d.sv!==undefined){UI.saved=+d.sv; viewReihen(); view.scrollTop=0; return;}
  if(d.svdel!==undefined){V.lineups.splice(+d.svdel,1); UI.saved=-1; save(); viewReihen(); return;}
  switch(b.id){
    case 'hard-reload':
      try{ (window.caches?caches.keys():Promise.resolve([])).then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}).then(function(){ location.reload(); }); }catch(err){ location.reload(); }
      break;
    case 'f-new': UI.onlyNew=!UI.onlyNew; UI.limit=40; viewKarten(); break;
    case 'f-mine': UI.onlyMine=!UI.onlyMine; UI.limit=40; viewKarten(); break;
    case 'f-more': UI.more=!UI.more; viewKarten(); break;
    case 'f-clear': UI.stat={};UI.xf='';UI.hgt='';UI.hand=''; viewKarten(); break;
    case 'newer-ok': S.seenNewer=D.meta.newer.version; save(); viewKarten(); break;
    case 'more': UI.limit+=60; results(); break;
    case 'install': if(installEvt){var ev=installEvt; installEvt=null; try{ev.prompt(); ev.userChoice.then(function(){ if(tab()==='setup') viewSetup(); });}catch(err){} } break;
    case 'clear': document.getElementById('clear-ask').innerHTML='<button class="btn" id="clear-yes">Wirklich alle '+V.owned.length+' entfernen</button>'; break;
    case 'clear-yes': V.owned=[];V.locks={};V.bans={};V.xfOn={}; UI.up=null; save(); render(); break;
    case 'share': shareRoster(); break;
    case 'sh-take': V.owned=SHARED.slice();V.locks={};V.bans={}; SHARED=null; history.replaceState(null,'',location.pathname+location.hash); UI.up=null; save(); render(); toast('Kader übernommen'); break;
    case 'sh-close': SHARED=null; history.replaceState(null,'',location.pathname+location.hash); RES=null; UI.up=null; render(); break;
    case 'imp-shot': document.getElementById('file-shot').click(); break;
    case 'imp-cam': document.getElementById('file-cam').click(); break;
    case 'imp-x': UI.imp=null; viewKader(); break;
    case 'imp-paste': UI.imp={step:'paste'}; viewKader(); break;
    case 'imp-cancel': if(UI.imp) UI.imp.cancel=true; if(SCAN_CTRL) SCAN_CTRL.abort(); break;
    case 'imp-paste-go': runPaste(document.getElementById('imp-text').value); break;
    case 'imp-ok':
      var n=0; UI.imp.found.forEach(function(f){ if(f.on&&V.owned.indexOf(f.sel)<0){V.owned.push(f.sel); n++;} });
      UI.imp=null; UI.up=null; save(); viewKader(); toast(n+(n===1?' Karte':' Karten')+' übernommen'); break;
    case 'ap-auto': apAuto(result()); UI.dAp=true; save(); viewReihen(); break;
    case 'ap-none': V.xfOn={}; UI.dAp=true; save(); viewReihen(); break;
    case 'sv-save':
      var r=result(), nm=(document.getElementById('sv-name').value||'').trim()||('Aufstellung '+(V.lineups.length+1));
      V.lineups.push({name:nm,info:lineupInfo(r),f:r.forwards.map(function(l){return l.players.map(key);}),d:r.defense.map(function(l){return l.players.map(key);}),g:r.goalies.map(key),c:r.totals.captain&&r.totals.captain.active?r.totals.captain.cap.k+r.totals.captain.cap.id:''});
      if(V.lineups.length>12) V.lineups.shift();
      save(); viewReihen(); toast('Aufstellung gemerkt'); break;
    case 'sv-back': UI.saved=-1; viewReihen(); break;
    case 'rv-ov': UI.rv='ov'; viewReihen(); break;
    case 'rv-det': UI.rv='det'; viewReihen(); break;
    case 'up-run': UI.up='run'; viewAnalyse(); setTimeout(function(){var o=opts();
      o.minOvr=+UI.upMin||0; o.maxOvr=+UI.upMax||0;
      if(UI.upMode!=='ovr'){ o.tol=+UI.upTol; UI.up=HUT.bonusUpgrades(D,result(),o,30); }
      else { UI.up=HUT.upgrades(D,result(),o,25); }
      if(tab()==='analyse') viewAnalyse();},30); break;
    case 'up-m-bonus': UI.upMode='bonus'; UI.up=null; viewAnalyse(); break;
    case 'up-m-ovr': UI.upMode='ovr'; UI.up=null; viewAnalyse(); break;
  }
});
view.addEventListener('input',function(e){
  var t0=e.target;
  if(t0.id==='b-lo'||t0.id==='b-hi'){
    var ba=document.getElementById('b-lo'), bb2=document.getElementById('b-hi'), bs=lbState();
    if(+ba.value>+bb2.value){ if(t0.id==='b-lo') ba.value=bb2.value; else bb2.value=ba.value; }
    bs.lo=+ba.value>UI.ovrLo?ba.value:''; bs.hi=+bb2.value<UI.ovrHi?bb2.value:''; dualFill('b'); return;
  }
  if(t0.id==='u-lo'||t0.id==='u-hi'){
    var ua=document.getElementById('u-lo'), ub=document.getElementById('u-hi');
    if(+ua.value>+ub.value){ if(t0.id==='u-lo') ua.value=ub.value; else ub.value=ua.value; }
    UI.upMin=+ua.value>UI.ovrLo?ua.value:''; UI.upMax=S.upMax=+ub.value<UI.ovrHi?ub.value:''; S.upMin=UI.upMin; UI.up=null; dualFill('u'); clearTimeout(UI.uT); UI.uT=setTimeout(save,300); return;
  }
  if(t0.id==='f-lo'||t0.id==='f-hi'){ var t=t0;

    var a=document.getElementById('f-lo'), b=document.getElementById('f-hi');
    if(+a.value>+b.value){ if(t.id==='f-lo') a.value=b.value; else b.value=a.value; }
    UI.min=+a.value>UI.ovrLo?a.value:''; UI.max=+b.value<UI.ovrHi?b.value:''; UI.limit=40; ovrFill();
    clearTimeout(UI.ovrT); UI.ovrT=setTimeout(results,120);
   return; }

  var t=e.target;
  if(t.id==='q'){UI.q=t.value; UI.limit=40; results();}
  else if(t.id==='kq'){UI.kq=t.value; var g=document.getElementById('kgroups'); if(g) g.innerHTML=kGroups(owned());}
  else if(t.dataset.stat!==undefined){var v=parseInt(t.value,10); if(v>0) UI.stat[t.dataset.stat]=v; else delete UI.stat[t.dataset.stat]; UI.limit=40; results();}
  else if(t.id==='s-cap'){S.cap=t.value; UI.up=null; save();}
  else if(t.id==='s-ap'){S.ap=t.value; save();}
});
view.addEventListener('change',function(e){
  if(tab()==='setup'&&e.target.id&&/^(s-(coach|captain|prio|strict|dhand|cap|ap|rate)|w-.*)$/.test(e.target.id)) setTimeout(function(){ if(tab()==='setup') viewSetup(); },0);
  var t=e.target, d=t.dataset;
  if(t.id==='f-type'){UI.type=t.value; UI.limit=40; results();}
  else if(t.id==='f-team'){UI.team=t.value; UI.limit=40; results();}
  else if(t.id==='f-nat'){UI.nat=t.value; UI.limit=40; results();}
  else if(t.id==='f-sort'){UI.sort=t.value; UI.limit=40; results();}
  else if(t.id==='f-xf'){UI.xf=t.value; UI.limit=40; results();}
  else if(t.id==='f-hgt'){UI.hgt=t.value; UI.limit=40; results();}
  else if(t.id==='f-hand'){UI.hand=t.value; UI.limit=40; results();}
  else if(t.id==='up-min'){UI.upMin=t.value; UI.up=null;}
  else if(t.id==='up-max'){UI.upMax=S.upMax=t.value; UI.up=null; save();}
  else if(t.id==='up-tol'){UI.upTol=S.upTol=t.value; UI.up=null; save();}
  else if(t.id==='s-coach'){S.coach=t.value; UI.up=null; save();}
  else if(t.id==='s-captain'){S.captain=t.value; save();}
  else if(t.id==='s-prio'){S.prio=t.value; UI.up=null; save();}
  else if(t.id==='s-strict'){S.strict=t.checked; UI.up=null; save();}
  else if(t.id==='s-forcecap'){S.forceCap=t.checked; UI.up=null; save();}
  else if(t.id==='s-dhand'){S.dHand=t.value; UI.up=null; save();}
  else if(t.id==='s-game'){S.game=t.value; save(); view.innerHTML='<div class="center mute">'+esc('NHL '+t.value)+' wird geladen …</div>'; var u=new URL(location.href); u.searchParams.delete('g'); u.searchParams.delete('k'); location.replace(u.pathname+u.search+'#setup');}
  else if(t.id==='s-rate'){S.useRating=t.checked; UI.up=null; save(); viewSetup();}
  else if(d.w){S.weights[d.w]=+t.value; UI.up=null; save();}
  else if(d.xf){ if(t.checked) V.xfOn[d.xf]=1; else delete V.xfOn[d.xf]; UI.dAp=true; var keep=RES; save(); RES=keep; viewReihen(); }
  else if(d.impon!==undefined){UI.imp.found[+d.impon].on=t.checked; viewImport();}
  else if(d.impsel!==undefined){UI.imp.found[+d.impsel].sel=t.value; UI.imp.found[+d.impsel].on=!isOwned(byKey[t.value]); UI.imp.found[+d.impsel].sure=true; viewImport();}
});
view.addEventListener('toggle',function(e){
  var t=e.target; if(t.dataset&&t.dataset.sg){ UI.sg=UI.sg||{}; UI.sg[t.dataset.sg]=t.open; return; } if(!t.id) return;
  if(t.id==='d-ap') UI.dAp=t.open; else if(t.id==='d-st') UI.dSt=t.open;
  else if(t.id==='d-nm'){UI.dNm=t.open; var el=document.getElementById('nm-body'); if(t.open&&el&&!el.innerHTML) el.innerHTML=nmHtml(result());}
},true);
document.getElementById('file-shot').addEventListener('change',function(){runImport(this.files); this.value='';});
document.getElementById('file-cam').addEventListener('change',function(){runImport(this.files); this.value='';});
window.addEventListener('hashchange',function(){ if(CARD){CARD=null; sheet.classList.remove('on'); document.body.classList.remove('sheet-open');} UI.saved=-1; if(tab()!=='kader'&&UI.imp&&UI.imp.step!=='scan') UI.imp=null; render(); view.scrollTop=0;});

load(); UI.upMax=S.upMax||''; UI.upMin=S.upMin||''; UI.upTol=S.upTol||'3'; render();
function loadData(){
  var urlGame=new URLSearchParams(location.search).get('g');
  return fetch('versions.json?v=__BUILD__').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}).then(function(vs){
    VERSIONS=vs&&vs.versions&&vs.versions.length?vs:null;
    var want=urlGame||S.game||(VERSIONS&&String(VERSIONS.default))||'';
    var ok=VERSIONS&&VERSIONS.versions.some(function(x){return String(x.version)===String(want);});
    var file=ok?'hut-'+want+'.json':'hut.json';
    return fetch(file+'?v=__BUILD__').then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
  });
}
loadData().then(function(d){
  D=d; LOGO=null; D.xf=D.xf||{}; D.captains=D.captains||[];
  VER=String(d.meta.version||((d.meta.img_base||'').match(/NHL(\d+)/)||[])[1]||'');
  var v=VD[VER]||{};
  V={owned:(v.owned||[]).slice(),locks:v.locks||{},bans:v.bans||{},lineups:v.lineups||[],xfOn:v.xfOn||{}};
  d.cards.forEach(function(c){byKey[key(c)]=c; (byName[c.n]=byName[c.n]||[]).push(c);});
  d.lists.team.forEach(function(t){teamName[t.id]=t.name;});
  d.lists.card_type.forEach(function(t){typeName[t.abbr]=t.name;});
  d.lists.xfactor.forEach(function(x){xfLogo[x.id]=x.logo;});
  document.getElementById('game').textContent=d.meta.game||(VER?'NHL '+VER:'');
  if(S.coach && !d.coaches.some(function(c){return c.name===S.coach;})) S.coach='';
  if(new URLSearchParams(location.search).get('g')&&!new URLSearchParams(location.search).get('k')) S.game=VER;
  var today=String(d.meta.updated).slice(0,10);
  if(S.lastSeen!==today){S.prevSeen=S.lastSeen||''; S.lastSeen=today; save();}
  var k=new URLSearchParams(location.search).get('k');
  if(k){var keys=decodeRoster(k).filter(function(x){return byKey[x];}); if(keys.length) SHARED=keys;}
  document.getElementById('stand').textContent='Stand '+new Date(d.meta.updated).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  if(SHARED&&tab()==='karten') location.hash='#reihen'; else render();
}).catch(function(err){
  view.innerHTML='<div class="center"><h2>Kartendaten konnten nicht geladen werden</h2><p class="mute">'+esc(err.message)+'. Lade die Seite neu.</p></div>';
});
})();
