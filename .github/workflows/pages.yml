name: Daten holen und Seite veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"   # täglich 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Schlägt der Abruf fehl, bricht der Lauf hier ab und die bisherige Seite bleibt online.
      # Daten älterer Spiele zwischenspeichern, damit sie nur einmal pro Woche abgerufen werden
      - name: Woche bestimmen
        id: wk
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data
          key: hutdata-${{ steps.wk.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            hutdata-${{ steps.wk.outputs.week }}-
            hutdata-
      - name: Kartendaten abrufen
        run: |
          # ältere Spiele nur beim nächtlichen oder manuellen Lauf neu abrufen, nicht bei jedem Push
          if [ "${{ github.event_name }}" = "push" ]; then export SKIP_OLD=1; fi
          python3 scraper/scrape.py data
          cp data/hut*.json data/versions.json app/
          # Versionskennung in alle Dateiverweise, damit nie alte und neue Dateien gemischt werden
          BUILD="${GITHUB_SHA::7}-$(date -u +%y%m%d%H%M)"
          sed -i "s/__BUILD__/$BUILD/g" app/index.html app/sw.js
      - name: Optimierer testen
        run: node tests/test_engine.js "$PWD"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
